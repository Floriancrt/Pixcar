        "422": { $ref: "#/components/responses/RdvInvalid" }
  # ---------------------------------------------------------------- calendrier avancé (docs/calendrier-avance.md, lot 3a)
  /v1/pro/garages/{id}/rdv/requests/{request}/move:
    post:
      tags: [Calendrier]
      summary: "Déplacer ou réaffecter un rendez-vous (mode avancé) : `{ day, time, staff?, station?, confirm? }`"
      description: |
        Même heure, autre mécanicien ou autre poste : sans prévenir le client. Autre heure : refusé tant que `confirm` n'est pas `true`
        (409 `confirm`), puis le client reçoit un e-mail avec le nouveau fichier d'agenda. Un conflit (ressource prise, absente, hors de ses
        heures…) renvoie 409 `conflict` avec `reasons` et `alternatives` ; rien n'est modifié.
      operationId: calMove
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: request, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalMoveInput" } } } }
      responses:
        "200": { description: La demande à jour., content: { application/json: { schema: { $ref: "#/components/schemas/RdvGarageRequest" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Conflit (`conflict`, avec `reasons` et `alternatives`), confirmation du changement d'heure attendue (`confirm`), rendez-vous passé ou clos (`state`), intervention commencée (`started`, lot 3c), mode simple (`simple_mode`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
