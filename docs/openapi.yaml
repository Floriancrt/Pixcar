        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
  /v1/pro/garages/{id}/rdv/calendar/blocks:
    post:
      tags: [Calendrier]
      summary: "Bloc interne : rendez-vous hors Pixcar (`job`, placé par le moteur) ou créneau bloqué (`hold`, ressources libres exigées)"
      description: |
        Mode avancé seulement. Un `job` occupe mécanicien et poste comme une demande, sans les règles de la réservation en ligne (délai, plafond,
        prestations proposées) et sans aucun e-mail. Un `hold` réserve des mécaniciens ou des postes de `time` à `to`. Rien n'est forcé :
        un conflit renvoie 409 `conflict` avec `reasons` et, pour un `job`, `alternatives`.
      operationId: calBlockCreate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalBlockInput" } } } }
      responses:
        "201": { description: "Bloc créé (`saved`).", content: { application/json: { schema: { $ref: "#/components/schemas/CalBlockSaved" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Mode simple (`simple_mode`), 1 000 blocs au plus (`too_many`), prestation sans exigences (`not_configured`), conflit (`conflict`, avec `reasons` et `alternatives`), travaux qui attendraient (`shifted` : la cause, `work` { start, end }, `back`, et des horaires de dépôt sans attente dans `alternatives` ; renvoyer avec `confirm: true` pour accepter).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/pro/garages/{id}/rdv/calendar/blocks/{block}:
    put:
      tags: [Calendrier]
      summary: Modifier ou déplacer un bloc interne (mêmes règles que la création)
      operationId: calBlockUpdate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: block, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalBlockInput" } } } }
      responses:
        "200": { description: "Bloc enregistré (`saved`).", content: { application/json: { schema: { $ref: "#/components/schemas/CalBlockSaved" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Mode simple (`simple_mode`), prestation sans exigences (`not_configured`), conflit (`conflict`, avec `reasons` et `alternatives`), travaux qui attendraient (`shifted`, comme à la création ; une modification qui garde l'heure de dépôt ne redemande pas), intervention commencée qui changerait de jour ou d'heure (`started`, lot 3c).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
    delete:
      tags: [Calendrier]
      summary: Supprimer un bloc interne (ses affectations partent avec lui)
      operationId: calBlockDelete
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: block, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Bloc supprimé., content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: boolean, enum: [true] } } } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
  /v1/pro/garages/{id}/rdv/calendar/work/{ref}:
    post:
      tags: [Calendrier]
      summary: "État de l'intervention (lot 3c) d'un rendez-vous Pixcar confirmé ou d'un rendez-vous hors Pixcar : `{ status, notify? }`"
      description: |
        Mode avancé. Passages possibles (`src/js/shared/work.js`) : prévue → voiture reçue ou client absent (une fois l'heure de dépôt
        passée) ; reçue → en cours, prête (ou retour à prévue) ; en cours → en attente de pièces, suspendue, prête ; en attente de
        pièces ou suspendue → en cours, prête ; prête → restituée (ou retour à en cours) ; restituée → prête ; client absent → prévue.
        Du jour du rendez-vous à 30 jours après. Un client absent ne retient plus ses ressources. Passée à « Prête », une demande Pixcar
        envoie au client « Votre voiture est prête » (une seule fois), sauf `notify: false`.
      operationId: calWork
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string, format: uuid }, description: "Identifiant de la demande ou du bloc `job`." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [planned, received, in_progress, waiting_parts, suspended, done, returned, no_show] }
                notify: { type: boolean, description: "Passage à `done` d'une demande Pixcar : prévenir le client (vrai par défaut)." }
      responses:
        "200":
          description: L'état enregistré.
          content:
            application/json:
              schema:
                type: object
                required: [id, work, notified]
                properties:
                  id: { type: string, format: uuid }
                  work: { $ref: "#/components/schemas/CalWork" }
                  notified: { type: boolean, description: "L'e-mail « Votre voiture est prête » vient d'être mis en file." }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Passage impossible ou demande pas confirmée (`state`), jour à venir ou heure de dépôt pas passée pour un absent (`too_early`), plus de 30 jours après (`too_late`), mode simple (`simple_mode`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/rdv/garages/{id}/times:
    get:
      tags: [Rendez-vous]
      summary: Horaires libres d'un garage pour ces prestations, et l'heure limite de sa réponse si l'on demandait maintenant
      operationId: rdvTimes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: services, in: query, required: true, schema: { type: string }, example: "vidange,montage:2", description: "1 à 5 prestations ; quantité (1 à 4) après « : » pour une prestation par pneu ou par roue." }
      responses:
        "200": { description: Les horaires libres, jour par jour., content: { application/json: { schema: { $ref: "#/components/schemas/RdvTimes" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "Rendez-vous en ligne fermés (`rdv_disabled`), ou garage qui ne les prend pas pour ces prestations (`not_open`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/rdv/requests:
    post:
      tags: [Rendez-vous]
      summary: Coordonnées et horaire choisi ; un code à 6 chiffres part par e-mail, rien n'est envoyé au garage avant lui
      description: |
        Limites : 5 envois de code par heure et 20 par jour depuis une même adresse IP (empreinte), 5 par jour vers une même adresse e-mail,
        200 par heure pour tout le service. Le champ `website` est un piège : rempli, la réponse est la même mais rien n'est fait.
      operationId: rdvRequest
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvRequestInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/RdvDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "Garage qui ne prend pas de rendez-vous en ligne pour ces prestations (`not_open`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Horaire plus libre (`time_taken`, avec `days`), ou trop de demandes en attente chez ce garage (`garage_busy`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
        "429": { description: "Limite d'envois de codes (`send_limited`, avec `scope`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "Le code n'a pas pu partir (`send_failed`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/rdv/requests/{id}/code:
    post:
      tags: [Rendez-vous]
      summary: "Essai du code (`{ code, day?, time? }`) : la demande part au garage ; le jeton de suivi est renvoyé"
      description: |
        L'horaire et la capacité sont revérifiés à ce moment ; s'il a été pris entre-temps (409 `time_taken`, avec `days`), le même code
        sert à en choisir un autre (`day`, `time`). Une adresse e-mail a au plus 1 demande en attente par garage et 3 en tout.
      operationId: rdvCode
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string }, day: { type: string, format: date }, time: { type: string, example: "08:30" } } } } } }
      responses:
        "200":
          description: Demande envoyée.
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/RdvClientView" }, { type: object, required: [token], properties: { token: { type: string, description: "Jeton de suivi (en-tête x-rdv-token de /v1/rdv/me)." } } }] } } }
        "404": { description: Introuvable., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Déjà envoyée ou close (`closed`), horaire pris (`time_taken`), trop de demandes en attente (`too_many_pending`, `garage_busy`), essai simultané (`busy`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: "Code expiré (`code_expired`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Code mal formé (`validation`) ou incorrect (`bad_code`, avec `attemptsLeft`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: "Trop d'essais (`locked`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/rdv/requests/{id}/resend:
    post:
      tags: [Rendez-vous]
      summary: Nouveau code (60 s après le précédent, 3 envois par demande)
      operationId: rdvResend
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/RdvDraft" }
        "404": { description: Introuvable., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Demande close (`closed`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Trop tôt (`resend_too_soon`) ou plus d'envoi possible (`send_limited`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/rdv/me:
    get:
      tags: [Rendez-vous]
      summary: "Suivi d'une demande par l'automobiliste (en-tête `x-rdv-token`), jusqu'à 7 jours après le rendez-vous"
      operationId: rdvMe
      parameters:
        - { name: x-rdv-token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: La demande., content: { application/json: { schema: { $ref: "#/components/schemas/RdvClientView" } } } }
        "404": { $ref: "#/components/responses/RdvLinkInvalid" }
  /v1/rdv/me/cancel:
    post:
      tags: [Rendez-vous]
      summary: "Annulation par l'automobiliste, jusqu'à l'heure du rendez-vous (`{ reason? }` : unable, other_garage, no_need, other) ; le garage est prévenu"
      operationId: rdvMeCancel
      parameters:
        - { name: x-rdv-token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: La demande à jour., content: { application/json: { schema: { $ref: "#/components/schemas/RdvClientView" } } } }
        "404": { $ref: "#/components/responses/RdvLinkInvalid" }
        "409": { $ref: "#/components/responses/RdvState" }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/rdv/action:
    get:
      tags: [Rendez-vous]
      summary: "Page du garage ouverte depuis l'e-mail « Nouvelle demande » (en-tête `x-rdv-token`, jeton du garage), sans connexion"
      operationId: rdvAction
      parameters:
        - { name: x-rdv-token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/RdvActionView" }
        "404": { $ref: "#/components/responses/RdvLinkInvalid" }
  /v1/rdv/action/accept:
    post:
      tags: [Rendez-vous]
      summary: Accepter depuis la page de l'e-mail
      operationId: rdvActionAccept
      parameters:
        - { name: x-rdv-token, in: header, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/RdvActionView" }
        "404": { $ref: "#/components/responses/RdvLinkInvalid" }
        "409": { $ref: "#/components/responses/RdvState" }
  /v1/rdv/action/decline:
    post:
      tags: [Rendez-vous]
      summary: "Refuser depuis la page de l'e-mail (`{ reason, note? }`)"
      operationId: rdvActionDecline
      parameters:
        - { name: x-rdv-token, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvReasonInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvActionView" }
        "400": { description: JSON illisible., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/RdvLinkInvalid" }
        "409": { $ref: "#/components/responses/RdvState" }
        "422": { $ref: "#/components/responses/RdvInvalid" }
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès du groupe d'utilisateurs Amazon Cognito de l'Espace Pro (signature RS256, émetteur, client et expiration vérifiés par l'API).
  responses:
    ProUnauthorized:
      description: "Jeton absent, invalide ou expiré (`unauthorized`)."
      headers: { WWW-Authenticate: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ProDisabled:
      description: "Espace Pro fermé (`pro_disabled`)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Paramètres manquants ou hors limites.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Trop de requêtes depuis cette adresse (ou plafond global d'écritures).
      headers: { Retry-After: { schema: { type: integer }, description: Secondes à attendre. } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Base momentanément indisponible. Réessayer ; la page garde la déclaration et la renvoie.
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CalState:
      description: L'état du calendrier avancé.
      content: { application/json: { schema: { $ref: "#/components/schemas/CalState" } } }
    CalSaved:
      description: "L'état, avec l'identifiant de la fiche enregistrée (`saved`)."
      content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/CalState" }, { type: object, required: [saved], properties: { saved: { type: string, format: uuid } } }] } } }
    RdvAgenda:
      description: Les disponibilités du garage.
      content: { application/json: { schema: { $ref: "#/components/schemas/RdvAgenda" } } }
    RdvAgendaCancelled:
      description: "Les disponibilités, et le nombre de demandes annulées par la fermeture (`cancelled`)."
      content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/RdvAgenda" }, { type: object, required: [cancelled], properties: { cancelled: { type: integer, minimum: 0 } } }] } } }
    RdvNotFound:
      description: "Garage pas rattaché à ce compte, créneau, fermeture ou demande introuvable (`not_found`), ou rendez-vous en ligne fermés (`rdv_disabled`)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RdvInvalid:
      description: "Saisie refusée (`validation`, avec `field` quand il est connu)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RdvState:
      description: "La demande n'est plus dans l'état voulu (`state`, avec `status`) : déjà décidée, heure limite passée, rendez-vous passé."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RdvLinkInvalid:
      description: "Jeton absent, inconnu ou expiré, ou demande effacée (`link_invalid`)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RdvDraft:
      description: Code envoyé à l'adresse e-mail.
      content: { application/json: { schema: { type: object, required: [id, email, expiresInSeconds, resendInSeconds, resendsLeft], properties: { id: { type: string, format: uuid }, email: { type: string }, expiresInSeconds: { type: integer }, resendInSeconds: { type: integer }, resendsLeft: { type: integer, minimum: 0 } } } } }
    RdvActionView:
      description: La demande vue par le garage, et si elle attend encore sa réponse (`open`).
      content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/RdvGarageRequest" }, { type: object, required: [open, garage], properties: { open: { type: boolean }, garage: { type: object, required: [name], properties: { name: { type: string } } } } }] } } }
  schemas:
    ProPriceInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [fixed, from, quote], description: "Forfait, « à partir de », sur devis." }
        price: { type: number, minimum: 1, maximum: 20000, description: "TTC, en euros ; absent pour « sur devis »." }
        vehicles: { type: array, items: { type: string, enum: [city, compact, sedan, suv, van] }, description: "Vide ou absent : tous les véhicules." }
        includes: { type: array, items: { type: string, enum: [parts, labour, extras] } }
    ProPrice:
      type: object
      required: [service, kind, price, vehicles, includes, status, state, confirmedAt, staleAt, updatedAt]
      properties:
        service: { type: string }
        kind: { type: string, enum: [fixed, from, quote] }
        price: { type: number, nullable: true }
        vehicles: { type: array, items: { type: string } }
        includes: { type: array, items: { type: string } }
        status: { type: string, enum: [published, review, rejected] }
        state: { type: string, enum: [ok, due, stale, review, rejected], description: "due : à confirmer dans les 30 jours ; stale : ancien." }
        confirmedAt: { type: string, format: date-time }
        staleAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProVisitCounts:
      type: object
      required: [recent, previous]
      properties:
        recent: { type: integer, minimum: 0 }
        previous: { type: integer, minimum: 0 }
    ProPublicGarage:
      type: object
      required: [id, verified, prices]
      properties:
        id: { type: string }
        verified: { type: boolean, enum: [true] }
        prices:
          type: array
          items:
            type: object
            required: [service, kind, price, vehicles, includes, updated, stale]
            properties:
              service: { type: string }
              kind: { type: string, enum: [fixed, from, quote] }
              price: { type: number, nullable: true }
              vehicles: { type: array, items: { type: string } }
              includes: { type: array, items: { type: string } }
              updated: { type: string, format: date, description: Dernière confirmation. }
              stale: { type: boolean }
        profile:
          type: object
          description: Seulement les champs publiés (absent quand aucun ne l'est).
          properties:
            name: { type: string }
            addr: { $ref: "#/components/schemas/ProAddr" }
            phone: { type: string, description: Format international. }
            website: { type: string }
            email: { type: string }
            hours: { $ref: "#/components/schemas/ProHours" }
        services:
          type: object
          description: Absent quand le garage n'a rien dit de ses prestations ; une liste vide est omise.
          properties:
            offered: { type: array, items: { type: string } }
            notOffered: { type: array, items: { type: string } }
        rdv:
          type: object
          description: Rendez-vous en ligne ouverts, avec un horaire libre dans les 14 jours pour ces prestations (quantité 1).
          required: [services]
          properties:
            services: { type: array, items: { type: string } }
            auto: { type: array, items: { type: string }, description: "Celles que le garage confirme aussitôt (calendrier avancé)." }
    RdvSettings:
      type: object
      required: [minDelayH, horizonDays, stepMin, holidays]
      properties:
        minDelayH: { type: integer, enum: [0, 2, 4, 24, 48] }
        horizonDays: { type: integer, enum: [7, 14, 21, 28] }
        stepMin: { type: integer, enum: [15, 30, 60] }
        holidays: { type: boolean, description: Fermé les jours fériés. }
    RdvSettingsInput:
      type: object
      properties:
        enabled: { type: boolean }
        minDelayH: { type: integer, enum: [0, 2, 4, 24, 48] }
        horizonDays: { type: integer, enum: [7, 14, 21, 28] }
        stepMin: { type: integer, enum: [15, 30, 60] }
        holidays: { type: boolean }
    RdvSlotInput:
      type: object
      required: [days, start, end, services]
      properties:
        name: { type: string, maxLength: 40, description: Pour le garage seulement. }
        days: { type: array, items: { type: string, enum: [mo, tu, we, th, fr, sa, su] } }
        start: { type: string, example: "08:00", description: Au quart d'heure, dans les horaires d'ouverture de chaque jour choisi. }
        end: { type: string, example: "12:00" }
        mode: { type: string, enum: [hour, drop], description: "À une heure précise, ou dépôt du véhicule (arrivée dans la première heure, voiture rendue en fin de créneau)." }
        capacity: { type: integer, minimum: 1, maximum: 9, description: Voitures en même temps. }
        services: { type: array, items: { type: string }, description: "Prestations faites, avec un temps moyen (Mon garage), qui tiennent dans le créneau." }
    RdvSlot:
      type: object
      required: [id, name, days, start, end, mode, capacity, services]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        days: { type: array, items: { type: string } }
        start: { type: string }
        end: { type: string }
        mode: { type: string, enum: [hour, drop] }
        capacity: { type: integer }
        services: { type: array, items: { type: string } }
    RdvClosureInput:
      type: object
      required: [first]
      properties:
        first: { type: string, format: date }
        last: { type: string, format: date, description: "Absent : un seul jour. 90 jours au plus." }
        label: { type: string, maxLength: 60 }
    CalHours:
      type: object
      nullable: true
      description: "Horaires propres (format de ProHours) ; null : ceux du garage."
    CalServiceList:
      type: array
      nullable: true
      items: { type: string }
      description: "Prestations (identifiants du catalogue) ; null : toutes."
    CalSettingsInput:
      type: object
      properties:
        receptionMin: { type: integer, minimum: 0, maximum: 60, description: "Accueil du véhicule avant les travaux, par 5 min." }
        returnMin: { type: integer, minimum: 0, maximum: 60, description: "Entre le véhicule prêt et la restitution annoncée, par 5 min." }
        loadPct: { type: integer, minimum: 50, maximum: 100, description: "Part de la capacité des mécaniciens ouverte en ligne, par 5 %." }
        maxDay: { type: integer, minimum: 0, maximum: 50, description: "Rendez-vous en ligne par jour (0 : sans limite)." }
        autoAssign: { type: boolean, description: "Faux : l'affectation des mécaniciens est proposée, à confirmer." }
        step: { type: integer, minimum: 0, maximum: 6, description: Dernière étape de l'assistant enregistrée. }
    CalStaffInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        active: { type: boolean }
        hours: { $ref: "#/components/schemas/CalHours" }
        services: { $ref: "#/components/schemas/CalServiceList" }
        skills: { type: array, items: { type: object, required: [id], properties: { id: { type: string, format: uuid }, until: { type: string, format: date, nullable: true } } } }
    CalSkillInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 2, maxLength: 50 }
        cert: { type: boolean, description: Habilitation (date de fin par mécanicien). }
    CalResourceInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { type: string, enum: [lift, quick, tyre, diag, align, clim, other] }
        active: { type: boolean }
        hours: { $ref: "#/components/schemas/CalHours" }
        services: { $ref: "#/components/schemas/CalServiceList" }
    CalReq:
      type: object
      required: [labour]
      properties:
        online: { type: boolean }
        labour: { type: integer, minimum: 5, maximum: 600, description: "Main-d'œuvre, par 5 min (par pneu ou par roue pour ces prestations)." }
        shared: { type: integer, minimum: 0, maximum: 120, description: Temps commun compté une fois quand plusieurs prestations se font ensemble. }
        immob: { type: integer, minimum: 5, maximum: 720, description: "Immobilisation du poste (au moins la main-d'œuvre)." }
        staffN: { type: integer, minimum: 1, maximum: 3 }
        skills: { type: array, items: { type: string, format: uuid } }
        stations: { type: array, items: { type: string }, description: "Types de poste possibles ; vide : sans poste." }
        tools: { type: array, items: { type: string }, description: Équipements en plus, pendant la main-d'œuvre. }
        margin: { type: integer, minimum: 0, maximum: 60 }
        auto: { type: boolean, description: "Confirmation automatique (impossible avec `parts`)." }
        parts: { type: boolean }
        partsH: { type: integer, enum: [0, 24, 48, 72, 120, 168] }
        drop: { type: boolean, description: Le client laisse sa voiture. }
        vehicles: { type: object, description: "Durées par type de véhicule : `{ suv: { labour, immob } }`." }
    CalUnavailInput:
      type: object
      required: [target, targetId, kind, first]
      properties:
        target: { type: string, enum: [staff, resource] }
        targetId: { type: string, format: uuid }
        kind: { type: string, enum: [absence, leave, training, maintenance, breakdown, other] }
        first: { type: string, format: date }
        last: { type: string, format: date }
        from: { type: string, example: "14:00", description: "Facultatif ; sans heure : journées entières." }
        to: { type: string, example: "18:00" }
        label: { type: string, maxLength: 60 }
    CalPlacementsInput:
      type: object
      properties:
        placements: { type: array, items: { type: object, required: [requestId], properties: { requestId: { type: string, format: uuid }, staff: { type: array, items: { type: string, format: uuid } }, station: { type: string, format: uuid, nullable: true } } } }
    CalMoveInput:
      type: object
      required: [day, time]
      properties:
        day: { type: string, format: date }
        time: { type: string, example: "14:00" }
        staff: { type: array, items: { type: string, format: uuid }, description: Mécaniciens choisis (sinon le moteur choisit). }
        station: { type: string, format: uuid, nullable: true }
        confirm: { type: boolean, description: Exigé quand l'heure change (le client est prévenu). }
    CalUnavail:
      type: object
      required: [id, target, targetId, kind, label, first, last, from, to, text]
      properties:
        id: { type: string, format: uuid }
        target: { type: string, enum: [staff, resource] }
        targetId: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        first: { type: string, format: date }
        last: { type: string, format: date }
        from: { type: string }
        to: { type: string }
        text: { type: string, example: "Formation : ven. 23 oct. (14:00–18:00)" }
    CalReadiness:
      type: object
      required: [ok, ready, problems]
      properties:
        ok: { type: boolean, description: L'activation est possible. }
        ready: { type: array, items: { type: string }, description: Prestations proposées en ligne. }
        problems: { type: array, items: { type: object, required: [text, blocking], properties: { service: { type: string }, text: { type: string }, blocking: { type: boolean } } } }
    CalAppointment:
      type: object
      required: [id, status, when, services, client, car]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        when: { type: object, required: [day, label, start, end, mode], properties: { day: { type: string, format: date }, label: { type: string }, start: { type: string }, end: { type: string }, mode: { type: string } } }
        services: { $ref: "#/components/schemas/RdvServices" }
        client: { type: string }
        car: { type: string }
        staff: { type: array, items: { type: string } }
        posts: { type: array, items: { type: string } }
        workStart: { type: string }
        back: { type: string }
        reasons: { type: array, items: { type: string } }
    CalAgendaItem:
      allOf:
        - { $ref: "#/components/schemas/CalAppointment" }
        - type: object
          required: [phone, plate, vehicle, work, plan]
          properties:
            phone: { type: string, description: "Téléphone du client (vide une fois effacé)." }
            plate: { type: string }
            vehicle: { type: string }
            work: { type: object, nullable: true, properties: { start: { type: string, format: date-time, nullable: true }, ready: { type: string, format: date-time, nullable: true }, back: { type: string, format: date-time, nullable: true }, labour: { type: integer, nullable: true }, status: { type: string, enum: [planned, received, in_progress, waiting_parts, suspended, done, returned] }, at: { type: string, format: date-time, nullable: true }, noShow: { type: boolean } } }
            plan: { type: array, items: { allOf: [{ $ref: "#/components/schemas/CalPlanRow" }, { type: object, required: [fixed] }] } }
    CalPlanRow:
      type: object
      required: [target, id, name, role, start, end]
      properties:
        target: { type: string, enum: [staff, resource] }
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [labour, station, tool] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        fixed: { type: boolean, description: Choisi par le garage (absent pour un bloc). }
    CalBlockInput:
      type: object
      required: [kind, label, day, time]
      properties:
        kind: { type: string, enum: [job, hold], description: "`job` : rendez-vous hors Pixcar ; `hold` : créneau bloqué." }
        label: { type: string, minLength: 2, maxLength: 40, description: "Court et sans donnée sensible (effacé 30 jours après le bloc)." }
        day: { type: string, format: date }
        time: { type: string, example: "08:00", description: Début (dépôt pour un `job`), par 5 minutes. }
        to: { type: string, example: "12:00", description: "Fin d'un `hold` (24:00 admis)." }
        services: { type: array, maxItems: 8, items: { oneOf: [{ type: string }, { type: object, required: [id], properties: { id: { type: string }, qty: { type: integer, minimum: 1, maximum: 4 } } }] }, description: "`job` : 1 à 8 prestations dont les exigences sont saisies." }
        vehicle: { type: string, description: "`job` : type de véhicule (exigé si une prestation en dépend)." }
        staff: { type: array, items: { type: string, format: uuid }, description: "`job` : 3 mécaniciens choisis au plus (sinon le moteur choisit) ; `hold` : mécaniciens bloqués." }
        station: { type: string, format: uuid, nullable: true, description: "`job` : poste choisi." }
        resources: { type: array, items: { type: string, format: uuid }, description: "`hold` : postes bloqués (10 mécaniciens et postes au plus)." }
        confirm: { type: boolean, description: "`job` : accepte que les travaux attendent le premier moment libre après le dépôt (réponse 409 `shifted` reçue avant)." }
        received: { type: boolean, description: "Création d'un `job` seulement (lot 3c) : client déjà sur place, aujourd'hui, au plus tard au prochain quart d'heure ; l'intervention est aussitôt « Voiture reçue »." }
    CalWork:
      type: object
      required: [status, at, noShow]
      description: "État de l'intervention (lot 3c). Client absent : `status` reste `planned` et `noShow` est vrai."
      properties:
        status: { type: string, enum: [planned, received, in_progress, waiting_parts, suspended, done, returned] }
        at: { type: string, format: date-time, nullable: true, description: Dernier changement. }
        noShow: { type: boolean }
    CalBlockSaved:
      type: object
      required: [saved]
      properties:
        saved: { type: string, format: uuid }
    CalBlock:
      type: object
      required: [id, kind, label, services, vehicle, when, startsAt, endsAt, fixed, plan]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [job, hold] }
        label: { type: string, description: Vide une fois effacé (30 jours après le bloc). }
        services: { type: array, items: { type: object, required: [id, qty, label], properties: { id: { type: string }, qty: { type: integer }, label: { type: string } } } }
        vehicle: { type: string }
        when: { type: object, required: [day, label, start, end], properties: { day: { type: string, format: date }, label: { type: string }, start: { type: string }, end: { type: string } } }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        fixed: { type: boolean }
        work: { allOf: [{ $ref: "#/components/schemas/CalWork" }], nullable: true, description: "`job` seulement : null tant que l'état n'a pas changé (« Prévue »)." }
        plan: { type: array, items: { $ref: "#/components/schemas/CalPlanRow" } }
    CalAgenda:
      type: object
      required: [from, to, today, days, staff, resources, services, vehicles, unavail, conflicts, blocks, appointments]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        today: { type: string, format: date }
        days: { type: array, items: { type: object, required: [day, open], properties: { day: { type: string, format: date }, open: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: string } }, example: [["08:00", "12:00"], ["14:00", "18:00"]] } } } }
        staff: { type: array, items: { type: object, required: [id, name, active], properties: { id: { type: string, format: uuid }, name: { type: string }, active: { type: boolean } } } }
        resources: { type: array, items: { type: object, required: [id, name, type, active], properties: { id: { type: string, format: uuid }, name: { type: string }, type: { type: string }, active: { type: boolean } } } }
        services: { type: array, items: { type: object, required: [id, label, unit, byVehicle], properties: { id: { type: string }, label: { type: string }, unit: { type: string }, byVehicle: { type: boolean } } } }
        vehicles: { type: array, items: { type: object, required: [id, label], properties: { id: { type: string }, label: { type: string } } } }
        unavail: { type: array, items: { allOf: [{ $ref: "#/components/schemas/CalUnavail" }, { type: object, required: [name], properties: { name: { type: string } } }] } }
        conflicts: { type: array, items: { type: object, required: [id, reasons], properties: { id: { type: string, format: uuid }, block: { type: boolean }, reasons: { type: array, items: { type: string } } } } }
        blocks: { type: array, items: { $ref: "#/components/schemas/CalBlock" } }
        appointments: { type: array, items: { $ref: "#/components/schemas/CalAgendaItem" } }
    CalState:
      type: object
      required: [today, mode, step, started, settings, booking, enabled, notify, hours, closures, staff, skills, resources, services, readiness, conflicts, catalogs]
      properties:
        today: { type: string, format: date }
        mode: { type: string, enum: [simple, advanced] }
        step: { type: integer, minimum: 0, maximum: 6 }
        started: { type: boolean }
        settings: { type: object, required: [receptionMin, returnMin, loadPct, maxDay, autoAssign], properties: { receptionMin: { type: integer }, returnMin: { type: integer }, loadPct: { type: integer }, maxDay: { type: integer }, autoAssign: { type: boolean } } }
        booking: { $ref: "#/components/schemas/RdvSettings" }
        enabled: { type: boolean }
        notify: { type: string, description: "Adresse vérifiée qui reçoit les demandes (vide : aucune)." }
        hours: { $ref: "#/components/schemas/ProHours" }
        closures: { type: array, items: { type: object, required: [id, first, last, label], properties: { id: { type: string, format: uuid }, first: { type: string, format: date }, last: { type: string, format: date }, label: { type: string } } } }
        staff: { type: array, items: { type: object, required: [id, name, active, hours, services, skills, unavail], properties: { id: { type: string, format: uuid }, name: { type: string }, active: { type: boolean }, hours: { $ref: "#/components/schemas/CalHours" }, services: { $ref: "#/components/schemas/CalServiceList" }, position: { type: integer }, skills: { type: array, items: { type: object, required: [id, until], properties: { id: { type: string, format: uuid }, until: { type: string, format: date, nullable: true } } } }, unavail: { type: array, items: { $ref: "#/components/schemas/CalUnavail" } } } } }
        skills: { type: array, items: { type: object, required: [id, label, cert], properties: { id: { type: string, format: uuid }, label: { type: string }, cert: { type: boolean } } } }
        resources: { type: array, items: { type: object, required: [id, name, type, active, hours, services, unavail], properties: { id: { type: string, format: uuid }, name: { type: string }, type: { type: string }, active: { type: boolean }, hours: { $ref: "#/components/schemas/CalHours" }, services: { $ref: "#/components/schemas/CalServiceList" }, position: { type: integer }, unavail: { type: array, items: { $ref: "#/components/schemas/CalUnavail" } } } } }
        services: { type: array, items: { type: object, required: [id, label, group, unit, minutes, req], properties: { id: { type: string }, label: { type: string }, group: { type: string }, unit: { type: string }, minutes: { type: integer, nullable: true }, req: { allOf: [{ $ref: "#/components/schemas/CalReq" }], nullable: true } } } }
        readiness: { $ref: "#/components/schemas/CalReadiness" }
        conflicts: { type: array, items: { $ref: "#/components/schemas/CalAppointment" }, description: "Rendez-vous à venir dont une affectation ne tient plus (absence, maintenance, fiche désactivée) ; jamais déplacés." }
        catalogs: { type: object, required: [types, kinds, vehicles, partsDelays, limits], properties: { types: { type: array, items: { type: object } }, kinds: { type: array, items: { type: object } }, vehicles: { type: array, items: { type: object } }, partsDelays: { type: array, items: { type: integer } }, limits: { type: object } } }
    RdvAgenda:
      type: object
      required: [today, enabled, paused, open, missing, settings, slots, closures, holidays, hours, services, notify, garage, todo]
      properties:
        today: { type: string, format: date, description: "Aujourd'hui à Paris, selon l'horloge de l'API (aperçus de la page)." }
        enabled: { type: boolean }
        paused: { type: boolean, description: Mise en pause automatique (3 demandes sans réponse de suite). }
        open: { type: boolean, description: "Les automobilistes voient des horaires : ouvert, pas en pause, rien ne manque." }
        missing: { type: array, items: { type: string, enum: [hours, notify, slots] } }
        settings: { $ref: "#/components/schemas/RdvSettings" }
        slots: { type: array, items: { $ref: "#/components/schemas/RdvSlot" } }
        closures: { type: array, items: { type: object, required: [id, first, last, label], properties: { id: { type: string, format: uuid }, first: { type: string, format: date }, last: { type: string, format: date }, label: { type: string } } } }
        holidays: { type: array, items: { type: object, required: [day, name], properties: { day: { type: string, format: date }, name: { type: string } } } }
        hours: { $ref: "#/components/schemas/ProHours" }
        services: { type: array, items: { type: object, required: [id, minutes], properties: { id: { type: string }, minutes: { type: integer } } }, description: "Prestations faites avec un temps moyen (privé)." }
        notify: { type: object, required: [email], properties: { email: { type: string }, pending: { type: string }, codeLive: { type: boolean } } }
        garage: { type: object, required: [name, addr, phone], properties: { name: { type: string }, addr: { type: string }, phone: { type: string } } }
        todo: { type: integer, minimum: 0 }
        calendar: { type: object, required: [mode, started], properties: { mode: { type: string, enum: [simple, advanced] }, started: { type: boolean } }, description: "Mode du calendrier (docs/calendrier-avance.md)." }
    RdvWhen:
      type: object
      required: [day, label, start, end, mode, startsAt, endsAt]
      properties:
        day: { type: string, format: date }
        label: { type: string, example: "mardi 21 octobre à 8:30" }
        start: { type: string }
        end: { type: string }
        mode: { type: string, enum: [hour, drop] }
        until: { type: string, description: "Dépôt : fin de la fenêtre d'arrivée." }
        back: { type: string, description: "Calendrier avancé, à l'heure : restitution prévue." }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    RdvServices:
      type: array
      items: { type: object, required: [id, qty, label], properties: { id: { type: string }, qty: { type: integer, minimum: 1, maximum: 4 }, label: { type: string } } }
    RdvGarageRequest:
      type: object
      required: [status, id, when, services, minutes, client, message, deadline, deadlineText]
      properties:
        status: { type: string, enum: [pending, confirmed, declined, expired, cancelled] }
        id: { type: string, format: uuid }
        when: { $ref: "#/components/schemas/RdvWhen" }
        services: { $ref: "#/components/schemas/RdvServices" }
        minutes: { type: integer }
        client: { type: object, required: [name, email, phone, car], properties: { name: { type: string }, email: { type: string }, phone: { type: string }, phoneText: { type: string }, car: { type: string }, year: { type: integer, nullable: true }, plate: { type: string } } }
        message: { type: string }
        deadline: { type: string, format: date-time, nullable: true }
        deadlineText: { type: string }
        slot: { type: object, properties: { name: { type: string }, capacity: { type: integer }, left: { type: integer } } }
        plan: { type: object, required: [staff, posts, fixed], properties: { staff: { type: array, items: { type: string } }, posts: { type: array, items: { type: string } }, fixed: { type: boolean }, proposed: { type: boolean, description: Affectation proposée, à confirmer. } }, description: "Calendrier avancé : qui fait l'intervention, sur quel poste." }
        reason: { type: string }
        reasonText: { type: string }
        note: { type: string }
        cancelledBy: { type: string, enum: [client, garage, closure] }
    RdvTimes:
      type: object
      required: [garage, services, deadline, deadlineText, days]
      properties:
        garage: { type: object, required: [id, name, addr], properties: { id: { type: string }, name: { type: string }, addr: { type: string } } }
        services: { $ref: "#/components/schemas/RdvServices" }
        deadline: { type: string, format: date-time, description: "Heure limite de réponse du garage si la demande partait maintenant." }
        deadlineText: { type: string, example: "lundi 20 octobre à 12:00" }
        auto: { type: boolean, description: "Calendrier avancé : la demande serait confirmée tout de suite." }
        needVehicle: { type: boolean, description: "Calendrier avancé : la durée dépend du véhicule ; redemander avec `vehicle` (days est vide)." }
        vehicle: { type: string }
        vehicles: { type: array, items: { type: object, required: [id, label], properties: { id: { type: string }, label: { type: string } } } }
        days:
          type: array
          items:
            type: object
            required: [day, label, times]
            properties:
              day: { type: string, format: date }
              label: { type: string, example: "mar. 21 oct." }
              times: { type: array, items: { type: object, required: [t], properties: { t: { type: string, example: "08:30" }, drop: { type: boolean }, until: { type: string }, end: { type: string } } } }
    RdvRequestInput:
      type: object
      required: [garageId, services, day, time, name, email, phone, car, year, plate]
      properties:
        garageId: { type: string }
        services: { type: array, items: { type: object, required: [id], properties: { id: { type: string }, qty: { type: integer, minimum: 1, maximum: 4 } } } }
        day: { type: string, format: date }
        time: { type: string, example: "08:30" }
        drop: { type: boolean, description: L'horaire choisi est un dépôt du véhicule. }
        vehicle: { type: string, enum: [city, compact, sedan, suv, van], description: "Calendrier avancé, quand la durée en dépend." }
        name: { type: string, maxLength: 80 }
        email: { type: string }
        phone: { type: string }
        car: { type: string, maxLength: 40 }
        year: { type: integer }
        plate: { type: string, example: EZ-108-BC, description: "Obligatoire. Plaque française SIV (AB-123-CD) ou ancienne FNI (1234 AB 31), avec ou sans tirets ni espaces ; gardée sous la forme AB-123-CD ou 1234AB31 (9 caractères au plus). Plaque étrangère : plateForeign à true, de 2 à 9 lettres et chiffres." }
        plateForeign: { type: boolean, description: "La plaque est étrangère (format libre, voir plate)." }
        message: { type: string, maxLength: 500 }
        remindPrice: { type: boolean, description: "Me rappeler par e-mail, après le rendez-vous, de déclarer ce que j'ai payé (une fois)." }
        website: { type: string, description: "Champ piège : à laisser vide." }
    RdvClientView:
      type: object
      required: [status, when, services, garage, car, email, deadline, deadlineText, canCancel, past]
      properties:
        status: { type: string, enum: [pending, confirmed, declined, expired, cancelled] }
        when: { $ref: "#/components/schemas/RdvWhen" }
        services: { $ref: "#/components/schemas/RdvServices" }
        garage: { type: object, required: [name, addr, phone], properties: { name: { type: string }, addr: { type: string }, phone: { type: string }, phoneText: { type: string }, lat: { type: number }, lon: { type: number } } }
        car: { type: object, properties: { model: { type: string }, year: { type: integer, nullable: true }, plate: { type: string } } }
        email: { type: string }
        deadline: { type: string, format: date-time, nullable: true }
        deadlineText: { type: string }
        sentText: { type: string }
        decidedText: { type: string }
        canCancel: { type: boolean }
        past: { type: boolean, description: "Le rendez-vous est passé (horloge de l'API)." }
        reasonText: { type: string }
        note: { type: string }
        cancelledBy: { type: string, enum: [client, garage, closure] }
        alternatives: { type: array, items: { type: object, required: [name, km, first], properties: { name: { type: string }, km: { type: string }, city: { type: string }, first: { type: string } } } }
        progress:
          type: object
          description: "Lot 3c : avancement de l'intervention, dès « Voiture reçue » (absent sinon, et pour un client noté absent)."
          required: [status, label, at, atText]
          properties:
            status: { type: string, enum: [received, in_progress, waiting_parts, suspended, done, returned] }
            label: { type: string, example: Travaux en cours }
            at: { type: string, format: date-time, nullable: true }
            atText: { type: string, example: mercredi 21 octobre à 10:20 }
    ProPrefs:
      type: object
      required: [shortcuts]
      properties:
        shortcuts: { type: array, maxItems: 6, items: { type: string, enum: [planning, requests, prices, agenda, garage, team, new, closure, site] } }
    ProAddr:
      type: object
      required: [street, pc, city]
      properties:
        street: { type: string }
        pc: { type: string, pattern: "^\\d{5}$" }
        city: { type: string }
    ProHours:
      type: object
      nullable: true
      description: "Par jour (mo, tu, we, th, fr, sa, su) : deux plages au plus, `[\"08:00\", \"12:00\"]`, au quart d'heure, dans l'ordre ; jour absent ou vide : fermé."
      example: { mo: [["08:00", "12:00"], ["14:00", "18:30"]], sa: [["08:00", "12:00"]] }
    ProProfile:
      type: object
      required: [name, addr, phone, website, email, hours, updatedAt]
      properties:
        name: { type: string, description: Vide tant qu'aucun changement de nom n'est approuvé. }
        addr:
          type: object
          nullable: true
          description: "`{ street, pc, city }`, vide (null) tant qu'aucun changement d'adresse n'est approuvé."
          required: [street, pc, city]
          properties: { street: { type: string }, pc: { type: string }, city: { type: string } }
        phone: { type: string }
        website: { type: string }
        email: { type: string }
        hours: { $ref: "#/components/schemas/ProHours" }
        updatedAt: { type: string, format: date-time, nullable: true }
    ProProfileChange:
      type: object
      required: [id, field, value, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        field: { type: string, enum: [name, addr, phone] }
        value: { description: "Texte, ou `{ street, pc, city }` pour l'adresse." }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: Motif d'un refus. }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    ProGarage:
      type: object
      required: [id, name, addr, distanceM, status, options]
      properties:
        id: { type: string }
        name: { type: string }
        addr: { type: string }
        distanceM: { type: integer, nullable: true, description: Distance à l'établissement (null quand le registre n'a pas de position). }
        status: { type: string, enum: [free, mine, claimed], description: "`claimed` : rattaché à un autre compte (vérification manuelle)." }
        options:
          type: array
          description: Moyens de vérification, dans l'ordre de la page (vide quand le garage n'est pas libre).
          items:
            type: object
            required: [id, channel, hint]
            properties:
              id: { type: string, example: "sms:1" }
              channel: { type: string, enum: [email, email_domain, sms] }
              hint: { type: string, example: "06 •• •• •• 78" }
              domain: { type: string, description: Option `email_domain` seulement. }
    ProClaim:
      type: object
      required: [id, garageId, garageName, status, channel, hint, holder]
      properties:
        id: { type: string, format: uuid }
        garageId: { type: string }
        garageName: { type: string }
        garageAddr: { type: string }
        status: { type: string, enum: [pending, verified, failed, revoked] }
        channel: { type: string, enum: [email, email_domain, sms] }
        hint: { type: string, description: Cible masquée (ou l'adresse composée par le demandeur pour l'option `domain`). }
        holder: { type: object, required: [name, role], properties: { name: { type: string }, role: { type: string, enum: [manager, employee, other] } } }
        codeLive: { type: boolean }
        expiresInSeconds: { type: integer, minimum: 0 }
        resendInSeconds: { type: integer, minimum: 0 }
        resendsLeft: { type: integer, minimum: 0 }
        attemptsLeft: { type: integer, minimum: 0 }
        verifiedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation }
            message: { type: string }
    Created:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [approved, pending], description: "`pending` : en attente de relecture, pas encore publique." }
    RepairInput:
      type: object
      required: [id, deleteToken, garage, serviceId, price, date, rating, vehicle]
      properties:
        id: { type: string, format: uuid, description: UUID v4 choisi par le navigateur (clé d'idempotence). }
        deleteToken: { type: string, pattern: "^[0-9a-fA-F]{32,128}$", description: Secret aléatoire, gardé par le navigateur ; sert à retirer la déclaration. }
        garage:
          type: object
          required: [id, name]
          properties:
            id: { type: string, description: "`osm:node/123`, `osm:way/45`, `osm:relation/6`, `siret:12345678901234` ou `custom:nom-saisi-a-la-main`.", example: "osm:node/123" }
            name: { type: string, minLength: 2, maxLength: 120 }
            addr: { type: string, maxLength: 200 }
            lat: { type: number, nullable: true }
            lon: { type: number, nullable: true }
            chainId: { type: string, maxLength: 40, description: Enseigne reconnue (`norauto`…), vide sinon. }
        area:
          type: object
          description: Point de recherche du visiteur. **Obligatoire quand le garage n'a pas de position** (nom saisi à la main).
          properties: { lat: { type: number }, lon: { type: number } }
        serviceId: { type: string, description: "Identifiant de prestation (src/js/shared/services.js) ; `autre` pour une réparation hors liste. Le contrôle technique n'est pas déclarable (ses prix sont officiels).", example: vidange }
        price: { type: number, minimum: 1, maximum: 20000, description: Euros TTC payés. }
        date: { type: string, format: date, description: "Jour de la réparation, entre 1990-01-01 et aujourd'hui (tolérance UTC+14)." }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500, description: Jamais renvoyé par l'API publique. }
        vehicle:
          type: object
          required: [model, year, plate]
          properties:
            model: { type: string, minLength: 2, maxLength: 40, example: Peugeot 208 }
            year: { type: integer, minimum: 1950, description: "Année de première mise en circulation ; pas après l'année de la réparation." }
            plate: { type: string, pattern: "^[A-Z]{2}-\\d{3}-[A-Z]{2}$", example: EZ-108-BC, description: Format SIV. Jamais stockée en clair ni renvoyée. }
    Area:
      type: object
      required: [v, cell, radius, generatedAt, truncated, garages]
      properties:
        v: { type: integer, enum: [1] }
        cell: { type: object, properties: { y: { type: integer }, x: { type: integer } }, description: Case de 0,05° dont dépend la réponse. }
        radius: { type: integer }
        generatedAt: { type: string, format: date-time }
        truncated: { type: boolean }
        garages:
          type: array
          items: { $ref: "#/components/schemas/GarageRepairs" }
    GarageRepairs:
      type: object
      required: [id, name, repairs]
      properties:
        id: { type: string }
        name: { type: string }
        addr: { type: string }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        chainId: { type: string }
        repairs:
          type: array
          items: { $ref: "#/components/schemas/PublicRepair" }
    PublicRepair:
      type: object
      required: [id, serviceId, price, month, rating, model, year]
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string }
        price: { type: number }
        month: { type: string, pattern: "^\\d{4}-\\d{2}$", description: Mois de la réparation (le jour n'est jamais public). }
        rating: { type: integer, minimum: 1, maximum: 5 }
        model: { type: string }
        year: { type: integer }
