openapi: 3.0.3
info:
  title: API Pixcar
  version: "1.0.0"
  description: |
    Réparations déclarées par les visiteurs (aucun compte, aucune session) et relais en cache vers OpenStreetMap.

    **L'API est une amélioration de la page, pas un prérequis** : la page sait chercher des garages et afficher les prix
    des enseignes sans elle. Quand elle est lente ou en panne, la page affiche la dernière copie qu'elle a gardée et
    renvoie plus tard les déclarations en attente (les écritures sont rejouables sans risque : voir `POST /v1/repairs`).

    ### Ce que l'API garde, et ce qu'elle ne renvoie jamais
    | Donnée | Stockée | Renvoyée par `GET` |
    |---|---|---|
    | prix, prestation, note, modèle, année du véhicule | oui | oui |
    | jour de la réparation | oui | **non** : le mois seulement |
    | commentaire | oui (relecture) | **non** |
    | plaque d'immatriculation | **non** : empreinte HMAC-SHA256 avec un secret du serveur, pour détecter les doublons | **non** |
    | adresse IP du visiteur | **non** : empreinte HMAC pour limiter le débit, purgée après 30 jours | **non** |
    | jeton de suppression | **non** : empreinte SHA-256 | **non** |

    ### Cache
    `GET /v1/repairs` et `GET /v1/overpass` portent `Cache-Control` avec `s-maxage`, `stale-while-revalidate` et
    `stale-if-error` : un CDN devant l'API absorbe la lecture et continue de répondre quand l'API ou sa base tombent.
    Les écritures ne sont jamais mises en cache.

    ### Erreurs
    Toujours `{ "error": { "code": "…", "message": "…" } }` ; `422` ajoute `fields` (champ → explication).
    `429` et `503` portent `Retry-After` (secondes).
  contact:
    name: Exploitation Pixcar
servers:
  - url: https://api.exemple.fr
    description: À remplacer par l'adresse de l'API (variable PIXCAR_API_BASE au moment du build de la page)
  - url: http://localhost:8787
    description: Développement (npm run dev)

tags:
  - name: Réparations
  - name: Relais OpenStreetMap
  - name: Espace Pro
    description: |
      Un compte Amazon Cognito (connexion sans mot de passe) prouve qu'il gère un garage : SIRET actif d'une activité de garage, situé
      au garage, puis un code à 6 chiffres reçu par un moyen **connu du garage** (e-mail public, e-mail sur le domaine du site propre au
      garage, SMS au portable). Quand le garage offre plusieurs moyens, le demandeur choisit. Ces routes répondent `404 pro_disabled`
      tant que l'Espace Pro n'est pas ouvert (`PRO_ENABLED=1`). Jeton : `Authorization: Bearer <jeton d'accès Cognito>`.
  - name: Rendez-vous
    description: |
      Rendez-vous en ligne (docs/rendez-vous.md, lot 2). Côté garage : compte de l'Espace Pro, garage rattaché. Côté automobiliste : sans
      compte, code à 6 chiffres par e-mail avant tout envoi, puis un jeton de suivi passé dans l'en-tête `x-rdv-token` (jamais dans
      l'adresse : les journaux notent le chemin). Ces routes répondent `404 rdv_disabled` tant que `RDV_ENABLED` ne vaut pas 1.
  - name: Calendrier
    description: |
      Calendrier avancé (docs/calendrier-avance.md, lot 3a) : mécaniciens, compétences, postes et équipements, exigences des prestations,
      absences ; activation avec les rendez-vous déjà pris, retour au mode simple, déplacement contrôlé. Mêmes droits que les routes
      « Rendez-vous » du garage.
  - name: Exploitation

paths:
  /v1/repairs:
    get:
      tags: [Réparations]
      summary: Réparations déclarées autour d'un point
      description: |
        Renvoie, groupées par garage, les réparations approuvées dans la case de 0,05° (≈ 5 km) qui contient le point,
        élargie de `radius` + 4,5 km. La page affine à la distance exacte. **Envoyer des coordonnées arrondies à 0,05°**
        (la réponse ne dépend que de la case) donne le même cache pour tous les visiteurs d'un quartier.
        Au plus 30 réparations (les plus récentes) par garage et par prestation, 3 000 par réponse (`truncated`).
      operationId: listRepairs
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: 45.75 }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: 4.85 }
        - name: radius
          in: query
          required: true
          description: Rayon de recherche de la page, en km.
          schema: { type: integer, enum: [3, 5, 10, 20, 30, 50] }
      responses:
        "200":
          description: Les réparations de la zone.
          headers:
            Cache-Control: { schema: { type: string }, example: "public, max-age=30, s-maxage=60, stale-while-revalidate=300, stale-if-error=86400" }
            ETag: { schema: { type: string }, description: Valideur faible ; `If-None-Match` donne un 304. }
            X-Pixcar-Stale: { schema: { type: string, enum: ["1"] }, description: Présent quand la base ne répond pas et que la dernière bonne réponse (moins d'une heure) est servie. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Area" }
        "304": { description: Inchangé. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [Réparations]
      summary: Déclarer une réparation
      description: |
        **Rejouable** : l'identifiant (UUID v4) est choisi par le navigateur. Renvoyer la même déclaration (même `id`,
        même `deleteToken`) après un échec réseau répond `200` sans rien écrire. Un même `id` avec un autre jeton est un
        conflit. Une même plaque, pour le même garage, la même prestation et le même jour, n'est acceptée qu'une fois.

        Un prix très éloigné de ce qui est déclaré à proximité pour la même prestation est accepté (`201`) mais reste
        `pending` (invisible) jusqu'à relecture (`node server/moderate.mjs`).

        En-tête `X-Turnstile-Token` : exigé seulement si le serveur est configuré avec `TURNSTILE_SECRET`.
      operationId: createRepair
      parameters:
        - { name: X-Turnstile-Token, in: header, required: false, schema: { type: string }, description: Jeton Cloudflare Turnstile (si l'anti-robot est activé). }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairInput" }
      responses:
        "201":
          description: Enregistrée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Created" }
        "200":
          description: "Déjà enregistrée à l'identique (rejeu) : rien n'est écrit."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Created" }
                  - { type: object, properties: { replayed: { type: boolean, enum: [true] } } }
        "400": { description: JSON illisible. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Vérification anti-robot refusée. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: "`id_conflict` (identifiant déjà pris par une autre déclaration) ou `duplicate` (même plaque, garage, prestation et jour)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { description: Corps de plus de 8 Ko. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Content-Type autre que application/json. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422":
          description: Un ou plusieurs champs invalides.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          fields: { type: object, additionalProperties: { type: string }, example: { price: "prix entre 1 et 20000 €" } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/repairs/{id}:
    delete:
      tags: [Réparations]
      summary: Retirer sa réparation
      description: |
        Seul le navigateur qui l'a déclarée connaît le jeton. Un jeton faux, un identifiant inconnu et une réparation déjà
        retirée répondent pareil (`404`) : l'API ne révèle pas ce qui existe. Suppression définitive.
        Reposter la même déclaration (même `id`, même `deleteToken`) la remet : c'est le « Annuler » de la page.
      operationId: deleteRepair
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Delete-Token, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{32,128}$" } }
      responses:
        "204": { description: Supprimée. }
        "404": { description: Introuvable (ou jeton incorrect). , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/overpass:
    get:
      tags: [Relais OpenStreetMap]
      summary: Garages d'OpenStreetMap autour d'un point (relais avec cache)
      description: |
        Le paramètre `data` doit être **exactement** la requête Overpass que produit la page pour l'un des six rayons
        (3, 5, 10, 20, 30, 50 km) ; toute autre requête est refusée (`400`). Le centre est arrondi à 3 décimales (≈ 80 m) et
        le rayon élargi de 100 m. Les serveurs OpenStreetMap sont interrogés en cascade ; la réponse est gardée en mémoire
        puis en base (frais 24 h) et servie **périmée** (jusqu'à 7 jours, `X-Pixcar-Stale: 1`) quand tous échouent.
        Seules les balises utilisées par la page sont renvoyées.
      operationId: overpass
      parameters:
        - { name: data, in: query, required: true, schema: { type: string }, description: Requête Overpass QL de la page, encodée. }
      responses:
        "200":
          description: Éléments OpenStreetMap, même forme que la réponse d'Overpass (`elements`).
          headers:
            Cache-Control: { schema: { type: string }, example: "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800" }
            X-Pixcar-Source: { schema: { type: string, enum: [memory, db, upstream] } }
            X-Pixcar-Stale: { schema: { type: string, enum: ["1"] } }
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements: { type: array, items: { type: object } }
                  server: { type: string, description: Serveur OpenStreetMap qui a répondu. }
                  generatedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { description: Trop de requêtes amont (par visiteur) ou serveur occupé. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Aucun serveur OpenStreetMap ne répond et aucune copie n'existe. , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/me:
    get:
      tags: [Espace Pro]
      summary: Le compte et ses garages (vérifiés ou en cours de vérification)
      operationId: proMe
      security: [{ cognito: [] }]
      responses:
        "200":
          description: Compte (« sub » Cognito) et demandes.
          content:
            application/json:
              schema:
                type: object
                required: [account, claims]
                properties:
                  account: { type: string }
                  claims: { type: array, items: { $ref: "#/components/schemas/ProClaim" } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/ProDisabled" }
  /v1/pro/siret/{siret}:
    get:
      tags: [Espace Pro]
      summary: Contrôle d'un SIRET et garages situés à cet établissement, avec leurs moyens de vérification masqués
      description: |
        Le registre public des entreprises (recherche-entreprises.api.gouv.fr) doit connaître le SIRET, l'établissement être actif et
        son activité principale être celle d'un garage (45.20A, 45.20B, 45.32Z, 45.11Z). Les garages proposés sont ceux de nos données
        à moins de 300 m de la position de l'établissement (même code postal et même nom quand le registre n'a pas de position). Les
        cibles ne sont jamais renvoyées en clair : `c•••••@garage-dupont.fr`, `06 •• •• •• 78`, ou le seul domaine pour l'option
        « domaine ». 30 interrogations du registre par heure et par compte (un SIRET vu depuis moins de 10 minutes ne compte pas).
      operationId: proSiret
      security: [{ cognito: [] }]
      parameters:
        - { name: siret, in: path, required: true, schema: { type: string }, description: "14 chiffres (espaces tolérés)." }
      responses:
        "200":
          description: Établissement et garages candidats (10 au plus, même nom d'abord, puis le plus proche).
          content:
            application/json:
              schema:
                type: object
                required: [establishment, garages]
                properties:
                  establishment:
                    type: object
                    required: [siret, name, addr, naf]
                    properties:
                      siret: { type: string, pattern: "^\\d{14}$" }
                      name: { type: string }
                      company: { type: string }
                      addr: { type: string }
                      naf: { type: string, example: 45.20A }
                  garages: { type: array, items: { $ref: "#/components/schemas/ProGarage" } }
        "400": { description: "SIRET mal formé ou clé de contrôle fausse (`bad_siret`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "SIRET inconnu du registre (`siret_not_found`), ou Espace Pro fermé (`pro_disabled`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Établissement fermé (`siret_closed`) ou activité qui n'est pas celle d'un garage (`siret_activity`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "Registre des entreprises injoignable (`sirene_unavailable`, Retry-After: 60) ou base indisponible.", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/claims:
    post:
      tags: [Espace Pro]
      summary: Demander le rattachement d'un garage et recevoir un code par le moyen choisi
      description: |
        Le SIRET est contrôlé à nouveau ; le garage doit être l'un des candidats de `GET /v1/pro/siret/{siret}`. Le code (6 chiffres,
        valable 10 minutes, 5 essais) part vers la cible connue du garage ; pour l'option `domain`, vers `localPart@domaine-du-garage`.
        Limites sur 24 h : 3 envois par compte vers un même garage, 10 vers un garage tous comptes confondus, 5 par compte ; 30 par heure
        pour tout le service ; 3 demandes en cours par compte.
        Une nouvelle demande du même compte pour le même garage remplace la précédente.
      operationId: proClaim
      security: [{ cognito: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siret, garageId, option, holder]
              properties:
                siret: { type: string }
                garageId: { type: string, description: Identifiant du garage (celui des tuiles de la carte). }
                option: { type: string, example: "email:0", description: "`id` d'une option de `ProGarage.options`." }
                localPart: { type: string, maxLength: 64, description: "Option `domain` seulement : la partie avant le @." }
                holder:
                  type: object
                  required: [firstName, lastName, role, certify]
                  properties:
                    firstName: { type: string, maxLength: 60 }
                    lastName: { type: string, maxLength: 60 }
                    role: { type: string, enum: [manager, employee, other] }
                    certify: { type: boolean, enum: [true], description: "« Je certifie être habilité(e) à représenter cet établissement »." }
      responses:
        "201": { description: Demande créée, code envoyé., content: { application/json: { schema: { $ref: "#/components/schemas/ProClaim" } } } }
        "400": { description: "JSON illisible (`bad_json`) ou SIRET mal formé (`bad_siret`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "SIRET inconnu du registre (`siret_not_found`), ou Espace Pro fermé (`pro_disabled`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Garage déjà rattaché à un autre compte (`already_claimed`, avec `contact`) ou au vôtre (`already_yours`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Champ invalide (`validation`, `holder`, `local_part`), option inconnue (`option`), garage pas à l'adresse de l'établissement (`siret_far`), SIRET refusé (`siret_closed`, `siret_activity`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Limite d'envois (`send_limited`, avec `scope` : garage (ce compte vers ce garage), garage_total, account, global), trop de demandes en cours (`too_many_pending`) ou trop d'interrogations du registre par ce compte (`rate_limited`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "Le code n'a pas pu partir (`send_failed`) : la demande est close.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Registre des entreprises injoignable (`sirene_unavailable`) ou base indisponible.", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/claims/{id}:
    get:
      tags: [Espace Pro]
      summary: État d'une demande du compte
      operationId: proGetClaim
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: La demande., content: { application/json: { schema: { $ref: "#/components/schemas/ProClaim" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Introuvable, ou demande d'un autre compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/claims/{id}/code:
    post:
      tags: [Espace Pro]
      summary: Essayer le code reçu
      description: Chaque essai est compté avant la comparaison. Le bon code rattache le garage au compte (un seul compte par garage).
      operationId: proCode
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^\\d{6}$" } } } } }
      responses:
        "200": { description: Vérifiée (ou déjà vérifiée)., content: { application/json: { schema: { $ref: "#/components/schemas/ProClaim" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: Introuvable., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Demande close (`claim_closed`), garage rattaché entre-temps à un autre compte (`already_claimed`), ou essai simultané (`busy`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: "Code expiré (`code_expired`) : en demander un nouveau.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Code faux (`bad_code`, avec `attemptsLeft`) ou mal formé (`validation`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { description: "Cinquième code faux (`locked`) : la demande est close.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/claims/{id}/resend:
    post:
      tags: [Espace Pro]
      summary: Recevoir un nouveau code (60 s après le précédent, 3 envois par demande)
      operationId: proResend
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Nouveau code envoyé ; l'ancien ne vaut plus., content: { application/json: { schema: { $ref: "#/components/schemas/ProClaim" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: Introuvable., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Demande close (`claim_closed`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Trop tôt (`resend_too_soon`, avec `retryAfter`) ou limite d'envois (`send_limited`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "Le code n'a pas pu partir (`send_failed`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}:
    get:
      tags: [Espace Pro]
      summary: Tableau de bord d'un garage rattaché au compte (prix annoncés, prix payés par ses clients, visites de sa fiche)
      description: |
        Seulement pour un garage rattaché (vérifié) à CE compte : sinon 404, sans dire si le garage existe. « Payé par vos clients » :
        médiane et nombre des déclarations approuvées sur ce garage, retrouvé comme la page le montre (garage OpenStreetMap de même nom à
        moins de 150 m, ou seul lieu à moins de 40 m, ou lieu de la table lui-même). Visites : visiteurs distincts par jour des 30 derniers
        jours (`recent`) et des 30 précédents (`previous`).
      operationId: proGarage
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Identifiant du garage (celui des tuiles de la carte). }
      responses:
        "200":
          description: Le tableau de bord.
          content:
            application/json:
              schema:
                type: object
                required: [garage, prices, paid, visits]
                properties:
                  garage:
                    type: object
                    required: [id, name, addr, verifiedAt, holderName]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      addr: { type: string }
                      verifiedAt: { type: string, format: date-time }
                      holderName: { type: string }
                  prices: { type: array, items: { $ref: "#/components/schemas/ProPrice" } }
                  paid: { type: object, description: "Par prestation : `{ median (€), n }`." }
                  visits:
                    type: object
                    required: [views, calls]
                    properties:
                      views: { $ref: "#/components/schemas/ProVisitCounts" }
                      calls: { $ref: "#/components/schemas/ProVisitCounts" }
                  rdv: { type: object, description: "Rendez-vous en ligne ouverts côté API : demandes à traiter, mode du calendrier (l'écran Planning n'existe qu'en mode avancé).", required: [todo, mode], properties: { todo: { type: integer, minimum: 0 }, mode: { type: string, enum: [simple, advanced] } } }
                  prefs: { $ref: "#/components/schemas/ProPrefs" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage introuvable ou pas rattaché à ce compte (`not_found`), ou Espace Pro fermé (`pro_disabled`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/prefs:
    put:
      tags: [Espace Pro]
      summary: "Raccourcis du tableau de bord de ce compte pour ce garage (lot 3c) : `{ shortcuts }`"
      description: |
        Six au plus, sans doublon, parmi les identifiants de `src/js/shared/work.js` (planning, requests, prices, agenda, garage, team,
        new, closure, site). Une liste vide est permise. Effacés avec le rattachement.
      operationId: proPrefs
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProPrefs" } } } }
      responses:
        "200": { description: Les raccourcis enregistrés., content: { application/json: { schema: { $ref: "#/components/schemas/ProPrefs" } } } }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Liste invalide (`validation`, `field` : shortcuts).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/prices/{service}:
    put:
      tags: [Espace Pro]
      summary: Annoncer (ou remplacer) le prix d'une prestation
      description: |
        Prestations du comparateur (`src/js/shared/services.js`), contrôle technique et « autre » exclus. Prix TTC en euros (1 à 20 000,
        deux décimales au plus), absent pour « sur devis ». Un prix à plus de 3 fois (ou moins du tiers de) la médiane des prix payés du
        secteur pour cette prestation (5 déclarations au moins) attend une relecture (`status: review`) et n'est pas public. Enregistrer
        vaut confirmation : le prix est marqué « ancien » 6 mois plus tard.
      operationId: proPutPrice
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string, example: vidange } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProPriceInput" } } }
      responses:
        "200": { description: Le prix enregistré., content: { application/json: { schema: { $ref: "#/components/schemas/ProPrice" } } } }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage introuvable ou pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Champ invalide (`validation`, avec `field` : service, kind, price, vehicles, includes).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Espace Pro]
      summary: Retirer le prix d'une prestation
      operationId: proDeletePrice
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Retiré. }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte, ou aucun prix pour cette prestation.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/confirm:
    post:
      tags: [Espace Pro]
      summary: « Tout confirmer » — les prix publiés ou en relecture repartent pour 6 mois
      operationId: proConfirm
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Nombre de prix confirmés., content: { application/json: { schema: { type: object, required: [confirmed], properties: { confirmed: { type: integer, minimum: 0 } } } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/profile:
    get:
      tags: [Espace Pro]
      summary: « Mon garage » — coordonnées connues, fiche déclarée, changements à relire, prestations et temps moyens
      description: |
        `garage` : ce que les données publiques disent du garage (OpenStreetMap, Overture) ; jamais ses contacts privés (e-mails et numéros
        qui servent à la vérification). `profile` : ce que le garage a déclaré et qui est publié (vide tant que rien ne l'est). `changes` :
        changements de nom, d'adresse ou de téléphone en attente, et ceux décidés depuis moins de 30 jours (motif d'un refus compris).
        `services` : les 17 prestations de l'Espace Pro (contrôle technique exclu), `offered` à `null` tant que le garage n'a rien dit ;
        `minutes` : temps moyen, privé (jamais montré aux automobilistes).
      operationId: proGetProfile
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La fiche du garage.
          content:
            application/json:
              schema:
                type: object
                required: [garage, profile, changes, services]
                properties:
                  garage:
                    type: object
                    required: [id, name, addr, pc]
                    properties: { id: { type: string }, name: { type: string }, addr: { type: string }, pc: { type: string } }
                  profile: { $ref: "#/components/schemas/ProProfile" }
                  changes: { type: array, items: { $ref: "#/components/schemas/ProProfileChange" } }
                  services:
                    type: array
                    items:
                      type: object
                      required: [service, offered, minutes]
                      properties:
                        service: { type: string }
                        offered: { type: boolean, nullable: true }
                        minutes: { type: integer, nullable: true, minimum: 15, maximum: 480 }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage introuvable ou pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      tags: [Espace Pro]
      summary: Site, e-mail affiché aux clients, horaires — publiés tout de suite
      description: |
        Seuls les champs présents sont écrits ; `""` (ou `null` pour les horaires) efface. Le site devient une adresse `https://…` complète.
        Nom, adresse et téléphone passent par `POST /v1/pro/garages/{id}/changes` (relus par Pixcar).
      operationId: proPutProfile
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                website: { type: string, example: garage-martin.fr }
                email: { type: string }
                hours: { $ref: "#/components/schemas/ProHours" }
      responses:
        "200": { description: La fiche après l'enregistrement., content: { application/json: { schema: { $ref: "#/components/schemas/ProProfile" } } } }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Champ invalide ou inconnu (`validation`, avec `field`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/changes:
    post:
      tags: [Espace Pro]
      summary: Demander un changement de nom, d'adresse ou de téléphone (relu par Pixcar avant publication)
      description: |
        Un seul changement en attente par champ : une nouvelle demande remplace la précédente. Rien n'est public avant l'approbation
        (fonction d'opérations, op « pro-change »). Adresse : `{ street, pc, city }` ; téléphone : un numéro, enregistré au format
        international.
      operationId: proPostChange
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value]
              properties:
                field: { type: string, enum: [name, addr, phone] }
                value: { description: "Texte, ou `{ street, pc, city }` pour l'adresse." }
      responses:
        "201": { description: Le changement, en attente., content: { application/json: { schema: { $ref: "#/components/schemas/ProProfileChange" } } } }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Valeur invalide (`validation`) ou déjà celle de la fiche (`unchanged`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/changes/{change}:
    delete:
      tags: [Espace Pro]
      summary: Annuler un changement en attente
      operationId: proDeleteChange
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: change, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Annulé. }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte, ou aucun changement en attente avec cet identifiant.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/services/{service}:
    put:
      tags: [Espace Pro]
      summary: Une prestation faite ou non, et son temps moyen
      description: |
        Temps moyen d'atelier pour une voiture courante (par pneu ou par roue quand la prestation a une unité), de 15 à 480 minutes par
        quart d'heure, ou `null` (à saisir) ; privé. Décocher (`offered: false`) retire le prix annoncé de la prestation
        (`priceRemoved: true`) ; annoncer un prix la coche.
      operationId: proPutService
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string, example: vidange } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offered]
              properties:
                offered: { type: boolean }
                minutes: { type: integer, nullable: true, minimum: 15, maximum: 480 }
      responses:
        "200":
          description: La prestation enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [service, offered, minutes, priceRemoved]
                properties:
                  service: { type: string }
                  offered: { type: boolean }
                  minutes: { type: integer, nullable: true }
                  priceRemoved: { type: boolean }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "Prestation inconnue ou valeur invalide (`validation`, avec `field` : service, offered, minutes).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/garages/{id}/registry:
    get:
      tags: [Espace Pro]
      summary: L'établissement rattaché dans le registre public des entreprises (lecture seule)
      description: SIRET du rattachement, lu dans « Recherche d'entreprises » (gardé 10 minutes, compté dans la limite de recherches du compte).
      operationId: proRegistry
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: L'établissement.
          content:
            application/json:
              schema:
                type: object
                required: [siret, name, company, addr, naf, nafLabel, active]
                properties:
                  siret: { type: string, pattern: "^\\d{14}$" }
                  name: { type: string }
                  company: { type: string }
                  addr: { type: string }
                  naf: { type: string, example: 45.20A }
                  nafLabel: { type: string, description: "Libellé NAF rév. 2 (vide pour un code hors de ceux d'un garage)." }
                  active: { type: boolean }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { description: "Garage pas rattaché à ce compte (`not_found`), ou établissement absent du registre (`siret_not_found`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Trop de lectures du registre pour ce compte (`rate_limited`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Registre injoignable (`sirene_unavailable`).", headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/pro/public/garages:
    get:
      tags: [Espace Pro]
      summary: Garages vérifiés parmi une liste, leurs prix annoncés publiés et leur fiche déclarée (pour le comparateur, sans compte)
      description: |
        Ni compte ni nom de personne : le fait que le garage est vérifié, ses prix publiés, les champs publiés de sa fiche (`profile` :
        nom et adresse relus par Pixcar, téléphone, site, e-mail, horaires) et les prestations qu'il dit faire ou non (`services`).
        **Jamais les temps moyens.** Les garages non vérifiés sont absents de la réponse. `stale` : prix non confirmé depuis 6 mois
        (« ancien »). Les prix annoncés ne se mélangent jamais aux prix payés (`GET /v1/repairs`).
      operationId: proPublicGarages
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: "1 à 100 identifiants de garages (ceux des tuiles), séparés par des virgules." }
      responses:
        "200":
          description: Les garages vérifiés de la liste.
          headers: { Cache-Control: { schema: { type: string }, description: "public, max-age=60" } }
          content:
            application/json:
              schema:
                type: object
                required: [garages]
                properties:
                  garages: { type: array, items: { $ref: "#/components/schemas/ProPublicGarage" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/ProDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pro/public/visits:
    post:
      tags: [Espace Pro]
      summary: Une visite de la fiche d'un garage vérifié (`view`) ou une touche « Appeler » (`call`)
      description: |
        Compté une fois par visiteur, jour, garage et type, et seulement pour un garage vérifié ; la réponse est la même dans tous les cas.
        Le visiteur n'est gardé que sous forme d'empreinte de son adresse IP propre au jour et au garage (deux jours ou deux garages ne se
        relient pas), 60 jours au plus ; le garagiste ne voit que des totaux.
      operationId: proVisit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [garageId, kind]
              properties:
                garageId: { type: string }
                kind: { type: string, enum: [view, call] }
      responses:
        "204": { description: Reçu. }
        "400": { description: "JSON illisible (`bad_json`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/ProDisabled" }
        "422": { description: "Champ invalide (`validation`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /healthz:
    get:
      tags: [Exploitation]
      summary: Le processus est vivant (ne touche pas la base)
      operationId: healthz
      responses:
        "200": { description: Vivant., content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
  /readyz:
    get:
      tags: [Exploitation]
      summary: Prêt à servir (la base répond en moins d'une seconde)
      description: À utiliser comme sonde du répartiteur de charge. Répond `503` pendant l'arrêt (vidange) pour que l'instance soit retirée avant sa fermeture.
      operationId: readyz
      responses:
        "200": { description: Prêt. , content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, db: { type: string, enum: [up] } } } } } }
        "503": { description: Base indisponible ou arrêt en cours. , content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, db: { type: string }, draining: { type: boolean } } } } } }

  # ---------------------------------------------------------------- rendez-vous en ligne (docs/rendez-vous.md, lot 2)
  /v1/pro/garages/{id}/rdv:
    get:
      tags: [Rendez-vous]
      summary: Disponibilités du garage (réglages, semaine type, fermetures, adresse de notification) et nombre de demandes à traiter
      operationId: rdvAgenda
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
  /v1/pro/garages/{id}/rdv/settings:
    put:
      tags: [Rendez-vous]
      summary: "Règles et interrupteur : `{ enabled?, minDelayH?, horizonDays?, stepMin?, holidays? }`"
      description: |
        Ouvrir (`enabled: true`) exige les horaires d'ouverture (Mon garage), une adresse de notification vérifiée et au moins un créneau
        (sinon 409 `not_ready` avec `missing`) ; rouvrir lève la mise en pause automatique.
      operationId: rdvSettings
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvSettingsInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Il manque de quoi ouvrir (`not_ready`, avec `missing` : hours, notify, slots).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/pro/garages/{id}/rdv/slots:
    post:
      tags: [Rendez-vous]
      summary: Ajouter un créneau à la semaine type (20 au plus)
      operationId: rdvSlotCreate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvSlotInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Déjà 20 créneaux (`too_many`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/pro/garages/{id}/rdv/slots/{slot}:
    put:
      tags: [Rendez-vous]
      summary: Modifier un créneau
      operationId: rdvSlotUpdate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvSlotInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "422": { $ref: "#/components/responses/RdvInvalid" }
    delete:
      tags: [Rendez-vous]
      summary: Retirer un créneau (les demandes déjà faites restent)
      operationId: rdvSlotDelete
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: slot, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
  /v1/pro/garages/{id}/rdv/closures:
    post:
      tags: [Rendez-vous]
      summary: Ajouter une fermeture ; les demandes et rendez-vous de la période sont annulés, clients prévenus
      operationId: rdvClosureCreate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvClosureInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgendaCancelled" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "409": { description: "Déjà 30 fermetures à venir (`too_many`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/RdvInvalid" }
  /v1/pro/garages/{id}/rdv/closures/{closure}:
    put:
      tags: [Rendez-vous]
      summary: Modifier une fermeture (les demandes de la nouvelle période sont annulées)
      operationId: rdvClosureUpdate
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: closure, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RdvClosureInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgendaCancelled" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
        "422": { $ref: "#/components/responses/RdvInvalid" }
    delete:
      tags: [Rendez-vous]
      summary: Retirer une fermeture
      operationId: rdvClosureDelete
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: closure, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/RdvAgenda" }
        "401": { $ref: "#/components/responses/ProUnauthorized" }
        "404": { $ref: "#/components/responses/RdvNotFound" }
  /v1/pro/garages/{id}/rdv/notify:
    post:
      tags: [Rendez-vous]
      summary: "Adresse privée qui recevra les demandes : envoi d'un code de vérification à cette adresse (`{ email }`)"
      operationId: rdvNotify
      security: [{ cognito: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        "200":
          description: Code envoyé.
