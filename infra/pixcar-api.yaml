AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  API Pixcar sans serveur : API Gateway HTTP + Lambda (Node 22, arm64) + Aurora DSQL. Ni réseau privé ni serveur à gérer ;
  la base est répartie sur plusieurs zones par conception et les coûts suivent l'usage.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "navigateur -> API GW HTTP ($default, limitation de débit) -> Lambda api (rôle de base pixcar_api) -> Aurora DSQL ; Lambda ops (rôle admin) lancée à la main ou par le planificateur"
    must:
      - "secrets (PLATE_PEPPER, IP_PEPPER) dans SSM SecureString, jamais dans cette pile ni dans l'environnement des fonctions"
      - "PLATE_PEPPER ne change jamais une fois en service (empreintes des plaques, doublons, effacement)"
      - "rôle de base pixcar_api = DML sur les tables de l'application seulement (APP_TABLES, server/migrate.mjs) ; admin réservé à la fonction ops"
      - "Espace Pro fermé tant que ProUserPoolId est vide (pile infra/pixcar-pro.yaml) ; contacts privés des garages jamais publiés"
      - "la durée des sauvegardes (BackupRetentionDays) est celle annoncée dans la politique de confidentialité : elles contiennent les empreintes de plaques"
    ref:
      - { at: docs/exploitation.md, has: "déploiement AWS, opérations, coûts, fin du plan gratuit" }
      - { at: docs/architecture.md, has: "schéma, API, choix de la base" }

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket S3 (versionné, privé) qui contient le paquet construit par scripts/build-lambda.mjs.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  CodeKey:
    Type: String
    Description: Clé de l'archive dans ce bucket (pixcar-lambda-<empreinte>.zip). Une nouvelle empreinte = une nouvelle version du code.
    AllowedPattern: '^[A-Za-z0-9._/-]+\.zip$'
  OpsCodeKey:
    Type: String
    Default: ""
    Description: Archive de la seule fonction d'opérations (vide = la même que l'API, CodeKey). Le déploiement automatique (scripts/deploy-api.mjs) y met d'abord le nouveau paquet pour migrer la base et l'auto-contrôler avant que l'API ne change.
    AllowedPattern: '^([A-Za-z0-9._/-]+\.zip)?$'
  AllowedOrigins:
    Type: String
    Default: "https://pixcar.fr,https://www.pixcar.fr"
    Description: Origines des navigateurs autorisées à appeler l'API (CORS), séparées par des virgules.
    AllowedPattern: '^https?://[A-Za-z0-9.:-]+(,https?://[A-Za-z0-9.:-]+)*$'
  SsmPrefix:
    Type: String
    Default: "/pixcar/prod/"
    Description: Préfixe des paramètres SSM SecureString PLATE_PEPPER et IP_PEPPER (créés avant la pile, chiffrés par la clé gérée alias/aws/ssm ; voir docs/exploitation.md).
    AllowedPattern: '^/[A-Za-z0-9/_-]*/$'
  OverpassUserAgent:
    Type: String
    Default: "Pixcar/1.0 (+https://pixcar.fr)"
    Description: Identifie Pixcar auprès des miroirs OpenStreetMap (Overpass) ; y mettre un moyen de vous joindre.
    MaxLength: 200
  ThrottleRatePerSecond:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Requêtes par seconde au plus, tous visiteurs confondus (API Gateway).
  ThrottleBurst:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Pic admis au-delà du débit moyen.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Exécutions simultanées réservées à l'API (0 = aucune réservation). Impossible tant que le quota Lambda du projet est de 10 ; voir docs/exploitation.md, 3 bis.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: Durée de conservation des journaux (ni adresse IP ni corps de requête n'y figurent).
  ApiDomainName:
    Type: String
    Default: ""
    Description: Nom de domaine de l'API (api.pixcar.fr). Vide tant que le certificat n'est pas validé.
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: Certificat ACM (même région) du domaine ci-dessus, validé par DNS. Vide tant qu'il n'est pas émis.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Adresse qui reçoit les alarmes (erreurs). Vide = pas d'alarme par courriel.
  BackupRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [0, 7, 14, 30, 35, 60, 90, 180, 365]
    Description: Durée de conservation des sauvegardes quotidiennes de la base (AWS Backup), 0 = aucune sauvegarde. Une demande d'effacement n'est complète qu'à l'expiration des sauvegardes ; voir docs/exploitation.md.
  RepairRetentionMonths:
    Type: Number
    Default: 24
    MinValue: 0
    MaxValue: 120
    Description: Durée de conservation des déclarations, en mois ; l'entretien quotidien efface les plus anciennes (0 = jamais, déconseillé). C'est la durée annoncée aux visiteurs (src/legal.json, repairRetentionMonths) ; les deux restent égales.
  BackupSchedule:
    Type: String
    Default: "cron(30 2 * * ? *)"
    AllowedPattern: '^cron\(.+\)$'
    Description: Moment de la sauvegarde quotidienne, en UTC (expression cron d'AWS Backup).
  ProUserPoolId:
    Type: String
    Default: ""
    Description: Espace Pro — groupe d'utilisateurs Cognito (sortie UserPoolId de la pile infra/pixcar-pro.yaml). Vide = Espace Pro fermé.
    AllowedPattern: '^([a-z]{2}(-[a-z]+)+-\d_[A-Za-z0-9]+)?$'
  ProClientId:
    Type: String
    Default: ""
    Description: Espace Pro — client d'application Cognito (sortie UserPoolClientId de la même pile).
    AllowedPattern: '^[a-z0-9]{0,64}$'
  ProEmailDomain:
    Type: String
    Default: pixcar.fr
    Description: Espace Pro — domaine de l'identité SES qui envoie les codes de vérification (verification@<domaine>).
  ProTestEstablishments:
    Type: String
    Default: ""
    Description: Espace Pro — établissements d'ESSAI (JSON, SIRET inventés reconnus sans le registre), le temps d'un essai de bout en bout. Vide en temps normal ; voir docs/exploitation.md, 10.8.
    MaxLength: 1500
  ProNotifyConfigurationArn:
    Type: String
    Default: ""
    Description: Espace Pro — ARN de la configuration AWS End User Messaging Notify (codes par SMS). Vide = pas de SMS (e-mail seulement).
    AllowedPattern: '^(arn:aws[a-z-]*:sms-voice:[a-z0-9-]+:\d{12}:\S+)?$'
  ProSesSandbox:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Espace Pro — « true » tant que SES est en mode test (sandbox) ; SES y contrôle aussi le droit d'envoi sur l'identité de chaque destinataire. Remettre à « false » une fois l'accès production accordé.
  ProEmailProvider:
    Type: String
    Default: ses
    AllowedValues: [ses, scaleway]
    Description: Espace Pro — envoi des codes de vérification par e-mail. « scaleway » (Scaleway Transactional Email, clé secrète dans le paramètre SSM <SsmPrefix>SCW_SECRET_KEY) tant que SES reste en mode test.
  ProScwProjectId:
    Type: String
    Default: ""
    Description: Espace Pro — identifiant du projet Scaleway qui porte le domaine d'envoi (UUID ; pas un secret). Exigé avec ProEmailProvider=scaleway.
    AllowedPattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$'
  RdvEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Rendez-vous en ligne (docs/rendez-vous.md, lot 2). « true » ouvre les routes /v1/rdv et crée la tâche horaire (RdvSchedule) ; exige l'Espace Pro et des e-mails qui partent vers n'importe quelle adresse (Scaleway, ou SES hors mode test).
  SiteUrl:
    Type: String
    Default: https://pixcar.fr
    AllowedPattern: '^https://[a-z0-9.-]+$'
    Description: Adresse du site, sans chemin ni barre finale ; les liens des e-mails de rendez-vous y mènent (pages rendez-vous/ et pro/).

Rules:
  ScalewayNeedsProject:
    RuleCondition: !Equals [!Ref ProEmailProvider, scaleway]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProScwProjectId, ""]]
        AssertDescription: ProEmailProvider=scaleway exige ProScwProjectId (identifiant du projet Scaleway).
  RdvNeedsMail:
    RuleCondition: !Equals [!Ref RdvEnabled, "true"]
    Assertions:
      - Assert: !Or [!Equals [!Ref ProEmailProvider, scaleway], !Equals [!Ref ProSesSandbox, "false"]]
        AssertDescription: RdvEnabled=true écrit à des automobilistes inconnus d'avance ; SES en mode test ne le permet pas (ProEmailProvider=scaleway, ou ProSesSandbox=false).

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref ApiDomainName, ""]], !Not [!Equals [!Ref ApiCertificateArn, ""]]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, "0"]]
  HasBackup: !Not [!Equals [!Ref BackupRetentionDays, "0"]]
  HasPro: !And [!Not [!Equals [!Ref ProUserPoolId, ""]], !Not [!Equals [!Ref ProClientId, ""]]]
  HasProSms: !And [!Condition HasPro, !Not [!Equals [!Ref ProNotifyConfigurationArn, ""]]]
  HasProSesSandbox: !And [!Condition HasPro, !Equals [!Ref ProSesSandbox, "true"]]
  HasProAlarm: !And [!Condition HasPro, !Condition HasAlarmEmail]
  HasProScaleway: !And [!Condition HasPro, !Equals [!Ref ProEmailProvider, scaleway]]
  HasRdv: !And [!Condition HasPro, !Equals [!Ref RdvEnabled, "true"]]
  HasOpsCodeKey: !Not [!Equals [!Ref OpsCodeKey, ""]]

Resources:
  # ---- base de données
  Cluster:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "DSQL : réparti sur plusieurs zones sans réplique à payer, rien à payer pour le calcul au repos, pas de VPC ; une base PostgreSQL gérée (RDS) coûterait un forfait mensuel même sans trafic"
        must: ["Retain + protection contre la suppression : contient les déclarations des visiteurs", "supprimer la pile ne supprime PAS la base (la retirer à la main après avoir levé la protection)"]
        mutable: review-required
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - { Key: Project, Value: pixcar }
        - { Key: Name, Value: !Sub "${AWS::StackName}-db" }

  # ---- fonction de l'API (rôle de base à moindre privilège)
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "30 jours par défaut (cfn-guard CW_LOGGROUP_RETENTION_PERIOD_CHECK en attend 365, accepté : aucune donnée personnelle dans les journaux) ; chiffrés par la clé du service, pas par une clé gérée par le projet (CLOUDWATCH_LOG_GROUP_ENCRYPTED accepté : 1 USD par mois et une politique de clé pour rien de sensible)"
        mutable: free-to-tune
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !Ref LogRetentionDays

  ApiRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "identité IAM de l'API ; sa base lui donne le rôle pixcar_api (lien créé par l'opération « migrate ») ; politique en ligne voulue (une par rôle, limitée à ses ressources) : cfn-guard IAM_NO_INLINE_POLICY_CHECK accepté"
        must: ["dsql:DbConnect seulement (jamais DbConnectAdmin)", "ssm:GetParameters sur les 2 secrets seulement (3 avec la clé Scaleway quand l'Espace Pro envoie par Scaleway)"]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Sid: Logs, Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt ApiLogGroup.Arn }
              - { Sid: Database, Effect: Allow, Action: "dsql:DbConnect", Resource: !GetAtt Cluster.ResourceArn }
              - Sid: Secrets
                Effect: Allow
                Action: "ssm:GetParameters"
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}PLATE_PEPPER"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}IP_PEPPER"
                  - !If [HasProScaleway, !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}SCW_SECRET_KEY", !Ref AWS::NoValue]
      Tags: [{ Key: Project, Value: pixcar }]

  ApiFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "toute l'API dans une fonction (server/lambda.mjs) ; arm64 = ~20 % moins cher ; 512 Mo suffisent (E/S, pas de calcul lourd) ; hors VPC voulu (cfn-guard LAMBDA_INSIDE_VPC accepté) : DSQL se joint par jeton IAM sans réseau privé, un VPC exigerait une passerelle NAT payante pour le relais Overpass"
        must: ["REQUEST_TIMEOUT_MS (10 s) < délai d'intégration de la passerelle (12 s) <= Timeout de la fonction (15 s) ; la passerelle coupe à 30 s au plus", "TRUST_PROXY=0 : l'adresse du visiteur vient de la passerelle (requestContext), pas d'en-têtes"]
        mutable: free-to-tune
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: API Pixcar (réparations déclarées par les visiteurs)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: api.handler
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 512
      Timeout: 15
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig: { LogGroup: !Ref ApiLogGroup, LogFormat: Text }
      Environment:
        Variables:
          NODE_ENV: production
          DSQL_ENDPOINT: !GetAtt Cluster.Endpoint
          DSQL_USER: pixcar_api
          DSQL_POOL_MAX: "2"
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          TRUST_PROXY: "0"
          OVERPASS_USER_AGENT: !Ref OverpassUserAgent
          SSM_PREFIX: !Ref SsmPrefix
          REQUEST_TIMEOUT_MS: "10000"
          LOG_LEVEL: info
          # Espace Pro : fermé tant que la pile infra/pixcar-pro.yaml n'a pas donné son groupe d'utilisateurs ; SMS seulement avec Notify
          PRO_ENABLED: !If [HasPro, "1", "0"]
          COGNITO_USER_POOL_ID: !Ref ProUserPoolId
          COGNITO_CLIENT_ID: !Ref ProClientId
          PRO_EMAIL_FROM: !Sub "Pixcar <verification@${ProEmailDomain}>"
          PRO_NOTIFY_CONFIGURATION_ID: !Ref ProNotifyConfigurationArn
          PRO_CHANNELS: !If [HasProSms, "email,email_domain,sms", "email,email_domain"]
          PRO_TEST_ESTABLISHMENTS: !Ref ProTestEstablishments
          PRO_EMAIL_PROVIDER: !Ref ProEmailProvider
          PRO_SCW_PROJECT_ID: !Ref ProScwProjectId
          # Rendez-vous en ligne : fermés tant que RdvEnabled ne vaut pas « true » (et l'Espace Pro ouvert)
          RDV_ENABLED: !If [HasRdv, "1", "0"]
          RDV_EMAIL_FROM: !Sub "Pixcar <rendez-vous@${ProEmailDomain}>"
          SITE_URL: !Ref SiteUrl
      Tags: [{ Key: Project, Value: pixcar }]

  # Espace Pro : droit d'envoyer les codes de vérification, et rien d'autre (une identité SES — les identités vérifiées en mode test de SES —, une configuration Notify)
  ApiProSendPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: HasPro
    Metadata:
      com.aws.cloudformation.Context:
        why: "politique à part, présente seulement quand l'Espace Pro est ouvert : le rôle de l'API n'a ce droit que si nécessaire"
        must: ["ses:SendEmail sur l'identité du domaine seulement (hors mode test de SES)", "en mode test de SES seulement (ProSesSandbox) : ses:SendEmail sur les identités vérifiées du compte, car SES contrôle aussi celle du destinataire", "sms-voice:SendNotifyTextMessage sur la configuration Notify seulement"]
    Properties:
      RoleName: !Ref ApiRole
      PolicyName: pro-send
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProEmail
            Effect: Allow
            Action: "ses:SendEmail"
            Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${ProEmailDomain}"
          # mode test de SES : seuls des destinataires vérifiés reçoivent, et SES vérifie le droit d'envoi sur leur identité aussi
          - !If
            - HasProSesSandbox
            - { Sid: ProEmailSandboxRecipients, Effect: Allow, Action: "ses:SendEmail", Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*" }
            - !Ref AWS::NoValue
          - !If
            - HasProSms
            - { Sid: ProSms, Effect: Allow, Action: "sms-voice:SendNotifyTextMessage", Resource: !Ref ProNotifyConfigurationArn }
            - !Ref AWS::NoValue

  # ---- passerelle HTTP
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref "AWS::StackName"
      Description: Passerelle publique de l'API Pixcar (le CORS est géré par l'application)
      ProtocolType: HTTP
      Tags: { Project: pixcar }

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 12000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${ApiIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Metadata:
      com.aws.cloudformation.Context:
        why: "limite globale de débit : dernier rempart avant la fonction (l'application limite déjà par visiteur, mais en mémoire par instance)"
        mutable: free-to-tune
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottleBurst
        ThrottlingRateLimit: !Ref ThrottleRatePerSecond
      Tags: { Project: pixcar }

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # ---- domaine personnalisé (api.pixcar.fr), une fois le certificat validé
  CustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - { CertificateArn: !Ref ApiCertificateArn, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2 }
      Tags: { Project: pixcar }

  CustomDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      DomainName: !Ref CustomDomain
      ApiId: !Ref HttpApi
      Stage: !Ref DefaultStage

  # ---- fonction d'opérations (migrations, modération, entretien, auto-contrôle) : rôle administrateur de la base
  OpsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ops"
      RetentionInDays: !Ref LogRetentionDays

  OpsRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "seule identité qui administre la base ; invoquée par les personnes autorisées (lambda:InvokeFunction) et par le planificateur"
        must: ["liste fermée d'opérations dans server/ops.mjs : jamais de SQL libre"]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: operations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Sid: Logs, Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt OpsLogGroup.Arn }
              - { Sid: DatabaseAdmin, Effect: Allow, Action: "dsql:DbConnectAdmin", Resource: !GetAtt Cluster.ResourceArn }
              - Sid: PlateSecret
                Effect: Allow
                Action: "ssm:GetParameters"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}PLATE_PEPPER"
      Tags: [{ Key: Project, Value: pixcar }]

  OpsFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "même archive que l'API (ou, le temps d'un déploiement, la suivante : OpsCodeKey), autre point d'entrée ; 300 s : la migration attend les index asynchrones de DSQL, l'auto-contrôle rejoue tous les cas"
        must: ["MIGRATIONS_DIR = dossier où Lambda décompresse l'archive (/var/task/db/migrations)", "API_ROLE_ARN = rôle de l'API : « migrate » le lie au rôle de base pixcar_api", "OpsCodeKey vide = CodeKey : une pile qui ne s'en sert pas reste comme avant"]
        mutable: free-to-tune
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ops"
      Description: Opérations d'exploitation de l'API Pixcar (migrate, stats, list, approve, reject, forget, purge, selfcheck, whoami)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: ops.handler
      Role: !GetAtt OpsRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !If [HasOpsCodeKey, !Ref OpsCodeKey, !Ref CodeKey] }
      MemorySize: 512
      Timeout: 300
      LoggingConfig: { LogGroup: !Ref OpsLogGroup, LogFormat: Text }
      Environment:
        Variables:
          NODE_ENV: production
          DSQL_ENDPOINT: !GetAtt Cluster.Endpoint
          API_ROLE_ARN: !GetAtt ApiRole.Arn
          MIGRATIONS_DIR: /var/task/db/migrations
          SSM_PREFIX: !Ref SsmPrefix
          REPAIR_RETENTION_MONTHS: !Ref RepairRetentionMonths
          LOG_LEVEL: info
      Tags: [{ Key: Project, Value: pixcar }]

  # ---- entretien quotidien (journal d'écritures, cache Overpass, garages sans réparation) ; tâche horaire des rendez-vous (RdvSchedule)
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: invoke-ops
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: "lambda:InvokeFunction", Resource: !GetAtt OpsFunction.Arn }
              - !If [HasRdv, { Effect: Allow, Action: "lambda:InvokeFunction", Resource: !GetAtt ApiFunction.Arn }, !Ref AWS::NoValue]
      Tags: [{ Key: Project, Value: pixcar }]

  PurgeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-purge"
      Description: Entretien quotidien de la base
      ScheduleExpression: "rate(1 day)"
      FlexibleTimeWindow: { Mode: FLEXIBLE, MaximumWindowInMinutes: 60 }
      State: ENABLED
      Target:
        Arn: !GetAtt OpsFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"op":"purge"}'
        RetryPolicy: { MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 2 }

  # Rendez-vous en ligne : toutes les heures à hh:05, heure de Paris. Les heures limites tombent toutes à midi : la passe de 12:05 les
  # traite ; les autres rattrapent un échec, envoient les rappels (la veille, dès 12:05) et les relances de prix (le lendemain, dès 10:05).
  # Appelle la fonction de l'API (qui a déjà la clé Scaleway et le rôle de base à moindre privilège), pas celle d'opérations.
  RdvSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasRdv
    Metadata:
      com.aws.cloudformation.Context:
        why: "expirer les demandes sans réponse à midi, envoyer rappels, relances et e-mails restés en file ; l'API ne garde rien en mémoire d'une requête à l'autre"
        must: ["Input {\"pixcar\":\"rdv-tick\"} : server/lambda.mjs ne le traite que sans requestContext (jamais depuis la passerelle)", "fuseau Europe/Paris : la passe de 12:05 suit les heures limites (midi)"]
        mutable: free-to-tune
    Properties:
      Name: !Sub "${AWS::StackName}-rdv"
      Description: Rendez-vous en ligne — expirations à midi, rappels, relances, e-mails en file
      ScheduleExpression: "cron(5 * * * ? *)"
      ScheduleExpressionTimezone: Europe/Paris
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !GetAtt ApiFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"pixcar":"rdv-tick"}'
        RetryPolicy: { MaximumEventAgeInSeconds: 1800, MaximumRetryAttempts: 2 }

  # ---- sauvegardes quotidiennes du cluster (AWS Backup) ; BackupRetentionDays = 0 les désactive
  BackupVault:
    Type: AWS::Backup::BackupVault
    Condition: HasBackup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "coffre des points de restauration de la base ; chiffré par la clé gérée par AWS Backup, pas par une clé du projet (1 USD par mois et une politique de clé pour des données que DSQL chiffre déjà au repos) ; pas de politique d'accès qui interdit la suppression des points de restauration : il faut pouvoir en retirer un à la main (erreur, demande d'effacement urgente)"
        must: ["Retain : un coffre qui contient des points de restauration ne se supprime pas avec la pile (CloudFormation ne sait pas le vider) ; le retirer à la main après avoir supprimé ses points de restauration"]
        mutable: review-required
    Properties:
      BackupVaultName: !Sub "${AWS::StackName}-vault"
      BackupVaultTags: { Project: pixcar }

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: HasBackup
    Metadata:
      com.aws.cloudformation.Context:
        why: "une sauvegarde complète par jour (DSQL ne se sauvegarde que par AWS Backup, en entier : ni sauvegarde incrémentale ni restauration à la seconde) ; 30 jours = compromis entre la distance à laquelle on récupère une erreur et le délai avant qu'un effacement demandé disparaisse aussi des sauvegardes"
        must: ["BackupRetentionDays est la durée à annoncer dans la politique de confidentialité", "aucune copie entre Régions (non prise en charge par le plan gratuit)", "fenêtre de lancement d'au moins 60 minutes et d'achèvement d'au moins 60 minutes de plus (contrainte d'AWS Backup)"]
        mutable: free-to-tune
    Properties:
      BackupPlan:
        BackupPlanName: !Sub "${AWS::StackName}-daily"
        BackupPlanRule:
          - RuleName: daily
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref BackupSchedule
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle: { DeleteAfterDays: !Ref BackupRetentionDays }
      BackupPlanTags: { Project: pixcar }

  BackupRole:
    Type: AWS::IAM::Role
    Condition: HasBackup
    Metadata:
      com.aws.cloudformation.Context:
        why: "identité que prend AWS Backup pour sauvegarder et restaurer le cluster, avec les deux stratégies gérées par AWS (sauvegarde, restauration), comme le rôle par défaut de la console ; aucune condition aws:SourceAccount dans la confiance : le rôle ne sert qu'aux plans du projet (il faut iam:PassRole pour le confier à AWS Backup) et une condition que le service ne renseignerait pas ferait échouer les sauvegardes sans bruit, faute d'alarme"
        must: ["approuvé par backup.amazonaws.com seulement"]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: backup.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"
      Tags: [{ Key: Project, Value: pixcar }]

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: HasBackup
    Properties:
      BackupPlanId: !GetAtt BackupPlan.BackupPlanId
      BackupSelection:
        SelectionName: !Sub "${AWS::StackName}-database"
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources: [!GetAtt Cluster.ResourceArn]

  # ---- alarmes par courriel (facultatives)
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Metadata:
      com.aws.cloudformation.Context:
        why: "non chiffré par la clé gérée alias/aws/sns : CloudWatch ne peut pas publier dans un sujet chiffré avec une clé gérée par AWS ; le message ne contient que le nom de l'alarme"
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"
      Subscription: [{ Protocol: email, Endpoint: !Ref AlarmEmail }]
      Tags: [{ Key: Project, Value: pixcar }]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: La fonction de l'API a échoué (voir le groupe de journaux de la fonction)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Réponses 5xx de la passerelle (base ou fonction en difficulté)
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  OpsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Une opération d'exploitation (entretien quotidien, migration) a échoué
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref OpsFunction }]
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Espace Pro : un garage demandé par plusieurs comptes en 24 h (litige ou tentative de blocage), d'après la ligne de journal de l'API
  ProContestedMetric:
    Type: AWS::Logs::MetricFilter
    Condition: HasPro
    Metadata:
      com.aws.cloudformation.Context:
        why: "le journal des fonctions est au format texte (horodatage et identifiant de requête devant le JSON) : filtre par terme, pas par champ JSON"
        must: ["le terme est celui que server/pro.mjs écrit (event « pro_contested »)"]
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '"pro_contested"'
      MetricTransformations:
        - { MetricNamespace: Pixcar, MetricName: ProContestedGarages, MetricValue: "1", DefaultValue: 0, Unit: Count }

  ProContestedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProAlarm
    DependsOn: ProContestedMetric
    Properties:
      AlarmDescription: "Espace Pro : un garage a été demandé par plusieurs comptes en 24 h (op pro-claims pour voir qui, puis vérification manuelle)"
      Namespace: Pixcar
      MetricName: ProContestedGarages
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Espace Pro : réputation d'envoi du compte SES (codes de vérification et codes Cognito). AWS met un compte en examen vers 5 % de
  # rebonds ou 0,1 % de plaintes : ces alarmes préviennent bien avant, pour couper l'envoi par e-mail (PRO_CHANNELS) si besoin.
  SesBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProAlarm
    Metadata:
      com.aws.cloudformation.Context:
        why: "métrique du compte SES entier, publiée par AWS sans dimension ; pas de données tant que rien ne part : non déclenchée"
        must: ["seuil sous le niveau d'examen d'AWS (5 %)"]
    Properties:
      AlarmDescription: "Espace Pro : taux de rebond des e-mails au-dessus de 2 % (AWS examine le compte vers 5 %) : vérifier les envois, couper l'e-mail (PRO_CHANNELS) si besoin"
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SesComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasProAlarm
    Metadata:
      com.aws.cloudformation.Context:
        must: ["seuil sous le niveau d'examen d'AWS (0,1 %)"]
    Properties:
      AlarmDescription: "Espace Pro : taux de plaintes des e-mails au-dessus de 0,05 % (AWS examine le compte vers 0,1 %) : vérifier les envois, couper l'e-mail (PRO_CHANNELS) si besoin"
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.0005
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: Adresse de l'API tant que le domaine personnalisé n'est pas en place
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  CustomDomainTarget:
    Condition: HasDomain
    Description: Cible de l'enregistrement DNS CNAME du domaine de l'API
    Value: !GetAtt CustomDomain.RegionalDomainName
  DsqlEndpoint:
    Description: Adresse du cluster Aurora DSQL
    Value: !GetAtt Cluster.Endpoint
  DsqlClusterId:
    Description: Identifiant du cluster Aurora DSQL
    Value: !GetAtt Cluster.Identifier
  ApiFunctionName:
    Description: Fonction de l'API
    Value: !Ref ApiFunction
  OpsFunctionName:
    Description: Fonction d'opérations (aws lambda invoke)
    Value: !Ref OpsFunction
  ApiRoleArn:
    Description: Rôle IAM de l'API, lié au rôle de base pixcar_api
    Value: !GetAtt ApiRole.Arn
  BackupVaultName:
    Condition: HasBackup
    Description: Coffre des sauvegardes de la base (aws backup list-recovery-points-by-backup-vault)
    Value: !Ref BackupVault
  BackupRoleArn:
    Condition: HasBackup
    Description: Rôle IAM d'AWS Backup (sauvegarde manuelle, restauration)
    Value: !GetAtt BackupRole.Arn
