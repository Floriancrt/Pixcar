AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Déploiement de l'API Pixcar depuis GitHub Actions (.github/workflows/deploy-api.yml, scripts/deploy-api.mjs) : le fournisseur
  d'identité OIDC de GitHub et un rôle que seul l'environnement « production » du dépôt peut prendre. Aucune clé d'accès stockée.
  Droits : déposer le paquet dans le bucket du code, changer le code des deux fonctions par la pile de l'API, lancer la fonction
  d'opérations (migration, auto-contrôle).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "GitHub Actions (job « deploy », environnement production, approuvé à la main) -> jeton OIDC -> sts:AssumeRoleWithWebIdentity -> ce rôle -> S3 (paquet), CloudFormation (jeux de modifications sur la pile de l'API, modèle inchangé), Lambda (fonction d'opérations)"
    must:
      - "le rôle ne se prend que depuis repo:<GitHubRepository>:environment:<GitHubEnvironment> (audience sts.amazonaws.com) : ni une autre branche sans l'environnement, ni une demande de fusion, ni un autre dépôt"
      - "pas de droit IAM hors iam:PassRole vers les deux rôles d'exécution de la pile, pour Lambda seulement ; pas de droit sur la base ni sur les secrets"
      - "la pile de l'API se met à jour avec son modèle actuel (UsePreviousTemplate) : changer le modèle reste une opération faite à la main, relue dans la console"
    ref:
      - { at: docs/exploitation.md, has: "déploiement automatique de l'API : mise en place, approbation, retour arrière" }

Parameters:
  GitHubRepository:
    Type: String
    Default: Floriancrt/Pixcar
    Description: Dépôt GitHub (propriétaire/nom) dont le workflow de déploiement peut prendre le rôle.
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Environnement GitHub du job de déploiement (réglé pour exiger ton approbation et la seule branche main).
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
  ApiStackName:
    Type: String
    Default: pixcar
    Description: Pile de l'API (infra/pixcar-api.yaml), même région que cette pile ; ses fonctions s'appellent <pile>-api et <pile>-ops.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,100}$'
  CodeBucket:
    Type: String
    Description: Bucket du code de la pile de l'API (son paramètre CodeBucket).
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Fournisseur token.actions.githubusercontent.com déjà présent dans le compte (IAM > Fournisseurs d'identité). Vide = cette pile le crée (un seul par compte).
    AllowedPattern: '^(arn:aws[a-z-]*:iam::\d{12}:oidc-provider/token\.actions\.githubusercontent\.com)?$'

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: "GitHub signe un jeton par job ; IAM le vérifie (autorités de certification reconnues : pas d'empreinte à tenir à jour)"
        must: ["audience sts.amazonaws.com, celle de aws-actions/configure-aws-credentials"]
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags: [{ Key: Project, Value: pixcar }]

  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "droits temporaires (1 h au plus) pour un seul job, au lieu d'une clé d'accès permanente dans les secrets de GitHub"
        must:
          - "la condition « sub » nomme l'environnement : sans l'approbation demandée par l'environnement, pas de rôle"
          - "les droits Lambda sont ceux que CloudFormation emploie pour mettre à jour une fonction (schéma AWS::Lambda::Function), sur les deux fonctions de la pile seulement"
          - "lambda:InvokeFunction sur la seule fonction d'opérations : sa liste d'opérations est fermée (server/ops.mjs), mais elle administre la base"
        mutable: review-required
    Properties:
      Description: !Sub "Deploiement de l'API ${ApiStackName} par GitHub Actions (${GitHubRepository}, environnement ${GitHubEnvironment})"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn] }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadApiStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackEvents]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*"
              - Sid: ChangeApiStackParameters
                Effect: Allow
                Action: [cloudformation:CreateChangeSet]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*"
                Condition:
                  StringLike: { cloudformation:ChangeSetName: "deploy-*" }
                  "Null": { cloudformation:TemplateUrl: "true" }
              - Sid: RunChangeSets
                Effect: Allow
                Action: [cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DeleteChangeSet]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/deploy-*/*"
              - Sid: UploadPackage
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/pixcar-lambda-*.zip"
              - Sid: FindPackage
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}"
                Condition:
                  StringLike: { s3:prefix: "pixcar-lambda-*" }
              - Sid: UpdateFunctionsThroughTheStack
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetFunctionScalingConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:ListTags
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PutRuntimeManagementConfig
                  - lambda:PutFunctionRecursionConfig
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiStackName}-api"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiStackName}-ops"
              - Sid: KeepTheFunctionsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApiStackName}-ApiRole-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ApiStackName}-OpsRole-*"
                Condition:
                  StringEquals: { iam:PassedToService: lambda.amazonaws.com }
              - Sid: MigrateAndSelfcheck
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiStackName}-ops"
      Tags: [{ Key: Project, Value: pixcar }]

Outputs:
  DeployRoleArn:
    Description: À recopier dans GitHub (Settings > Environments > production > Environment variables) sous le nom AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  GitHubOidcProviderArn:
    Description: Fournisseur d'identité de GitHub utilisé par le rôle.
    Value: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
