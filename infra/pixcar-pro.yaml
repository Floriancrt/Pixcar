AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Espace Pro de Pixcar : identité d'envoi SES du domaine puis comptes sans mot de passe (Amazon Cognito, code par e-mail). Pile séparée de
  l'API : ses sorties deviennent des paramètres de la pile pixcar. Deux temps : CreateAccounts=false (identité SES seule, DKIM à publier
  chez le registraire), puis true. Avec CodeKey et ScwProjectId, Cognito confie ses e-mails à une fonction qui les envoie par Scaleway.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "page pro/ -> Cognito (InitiateAuth USER_AUTH, EMAIL_OTP) -> jeton d'accès -> API Pixcar (vérifie le jeton) ; Cognito et l'API envoient leurs e-mails par SES, ou par Scaleway (déclencheur Cognito de cette pile ; ProEmailProvider de la pile pixcar), domaine du paramètre EmailDomain"
    must:
      - "connexion sans mot de passe par code e-mail : Cognito l'exige en niveau Essentials ET avec un envoi par SES (pas l'envoi par défaut de Cognito) ; la configuration SES reste en place même quand le déclencheur « custom email sender » envoie par Scaleway"
      - "déclencheur « custom email sender » : Cognito chiffre chaque code avec la clé KMS de la pile et appelle la fonction ; jamais de code en clair hors de la fonction"
      - "client d'application public (pas de secret) : la page est statique ; seuls USER_AUTH et REFRESH_TOKEN_AUTH sont permis"
      - "le groupe d'utilisateurs contient les comptes des garagistes : conservé si la pile est supprimée"
    ref:
      - { at: docs/exploitation.md, has: "Espace Pro : ordre des actions AWS et DNS, sortie du mode test SES" }

Parameters:
  EmailDomain:
    Type: String
    Default: pixcar.fr
    Description: Domaine d'envoi (identité SES vérifiée par DKIM ; trois enregistrements CNAME à publier chez le registraire).
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  CreateAccounts:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: '"true" seulement quand l''identité SES du domaine est vérifiée (Cognito refuse un envoi par une identité non vérifiée).'
  CognitoEmailFrom:
    Type: String
    Default: "Pixcar <connexion@pixcar.fr>"
    Description: Expéditeur des codes de connexion envoyés par Cognito (adresse du domaine ci-dessus).
    MaxLength: 200
  CodeBucket:
    Type: String
    Default: ""
    Description: Bucket S3 du paquet Lambda de Pixcar (le même que pour la pile pixcar) ; vide = pas de déclencheur d'envoi.
  CodeKey:
    Type: String
    Default: ""
    Description: Clé S3 du paquet Lambda (pixcar-lambda-<empreinte>.zip, point d'entrée cognito-email.handler) ; vide = Cognito envoie par SES.
  ScwProjectId:
    Type: String
    Default: ""
    Description: Identifiant du projet Scaleway (UUID, pas un secret) qui porte le domaine d'envoi ; vide = Cognito envoie par SES.
    AllowedPattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$'
  SsmPrefix:
    Type: String
    Default: /pixcar/prod/
    Description: Préfixe du paramètre SSM SecureString SCW_SECRET_KEY (clé secrète Scaleway, créée à la main, jamais dans cette pile).
    AllowedPattern: '^/[A-Za-z0-9/_.-]*/$'
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
    Description: Durée de conservation des journaux de la fonction d'envoi.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Sujet SNS des alarmes (pixcar-alarms, créé par la pile pixcar) ; vide = pas d'alarme sur la fonction d'envoi.
    AllowedPattern: '^(arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+)?$'

Rules:
  SenderNeedsCode:
    RuleCondition: !Not [!Equals [!Ref ScwProjectId, ""]]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref CodeBucket, ""]], !Not [!Equals [!Ref CodeKey, ""]]]
        AssertDescription: ScwProjectId exige CodeBucket et CodeKey (paquet Lambda qui contient cognito-email.handler).

Conditions:
  HasAccounts: !Equals [!Ref CreateAccounts, "true"]
  HasCustomSender: !And [!Condition HasAccounts, !Not [!Equals [!Ref CodeKey, ""]], !Not [!Equals [!Ref ScwProjectId, ""]]]
  HasSenderAlarm: !And [!Condition HasCustomSender, !Not [!Equals [!Ref AlarmTopicArn, ""]]]

Resources:
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "Easy DKIM 2048 bits : les codes partent signés du domaine de Pixcar (meilleure délivrabilité, pas d'usurpation)"
        must: ["les 3 CNAME DKIM (sorties) publiés chez le registraire avant toute mise en service", "le compte SES sort du mode test sur demande (support AWS) : en mode test, seuls des destinataires vérifiés reçoivent les codes"]
    Properties:
      EmailIdentity: !Ref EmailDomain
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      FeedbackAttributes:
        EmailForwardingEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: HasAccounts
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: "comptes des garagistes, identifiés par leur e-mail ; connexion par code reçu par e-mail (aucun mot de passe à créer ni à oublier)"
        must: ["UserPoolTier ESSENTIALS (connexion par code e-mail)", "EmailSendingAccount DEVELOPER par l'identité SES du domaine", "protection contre la suppression active"]
        mutable: review-required
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-garagistes"
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      DeletionProtection: ACTIVE
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors: [EMAIL_OTP, PASSWORD]
        PasswordPolicy:
          MinimumLength: 12
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: !Ref CognitoEmailFrom
        SourceArn: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailDomain}"
      LambdaConfig: !If
        - HasCustomSender
        - CustomEmailSender: { LambdaArn: !GetAtt CognitoEmailFunction.Arn, LambdaVersion: V1_0 }
          KMSKeyID: !GetAtt CognitoEmailKey.Arn
        - !Ref AWS::NoValue
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Pixcar : votre code de confirmation"
        EmailMessage: "Votre code de confirmation pour l'Espace Pro Pixcar : {####}. Si vous n'avez rien demandé, ignorez ce message."
      UserPoolTags: { Project: pixcar }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasAccounts
    Metadata:
      com.aws.cloudformation.Context:
        why: "client public de la page pro/ (statique) : pas de secret possible dans une page"
        must: ["GenerateSecret false", "flux USER_AUTH et REFRESH_TOKEN_AUTH seulement", "révocation des jetons active (déconnexion)"]
    Properties:
      ClientName: pixcar-pro-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      EnableTokenRevocation: true
      # LEGACY : « aucun compte pour cette adresse » s'affiche tel quel. L'inscription (SignUp) révèle de toute façon qu'une adresse a un compte ;
      # masquer l'erreur à la connexion ne protégerait rien et laisserait un garagiste sans compte attendre un code qui n'arrive jamais.
      PreventUserExistenceErrors: LEGACY
      AuthSessionValidity: 10
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  # ---- Envoi des e-mails de Cognito par Scaleway (SES reste en mode test) : clé KMS, fonction, droit d'appel de Cognito
  CognitoEmailKey:
    Type: AWS::KMS::Key
    Condition: HasCustomSender
    Metadata:
      com.aws.cloudformation.Context:
        why: "Cognito chiffre chaque code avec cette clé avant d'appeler la fonction (exigé par le déclencheur « custom email sender »)"
        must: ["clé symétrique", "seule la fonction d'envoi a kms:Decrypt", "Cognito chiffre (kms:Encrypt, GenerateDataKey) pour ce compte seulement"]
    Properties:
      Description: Pixcar — chiffrement des codes que Cognito confie à la fonction d'envoi (Scaleway)
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: CognitoEncryptsCodes
            Effect: Allow
            Principal: { Service: cognito-idp.amazonaws.com }
            Action: ["kms:Encrypt", "kms:GenerateDataKey"]
            Resource: "*"
            Condition: { StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId } }
      Tags: [{ Key: Project, Value: pixcar }]

  CognitoEmailLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasCustomSender
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-cognito-email"
      RetentionInDays: !Ref LogRetentionDays

  CognitoEmailRole:
    Type: AWS::IAM::Role
    Condition: HasCustomSender
    Metadata:
      com.aws.cloudformation.Context:
        must: ["journal de la fonction, kms:Decrypt sur la clé de la pile, ssm:GetParameters sur SCW_SECRET_KEY : rien d'autre"]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cognito-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Sid: Logs, Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt CognitoEmailLogGroup.Arn }
              - { Sid: DecryptCodes, Effect: Allow, Action: "kms:Decrypt", Resource: !GetAtt CognitoEmailKey.Arn }
              - Sid: ScalewayKey
                Effect: Allow
                Action: "ssm:GetParameters"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}SCW_SECRET_KEY"
      Tags: [{ Key: Project, Value: pixcar }]

  CognitoEmailFunction:
    Type: AWS::Lambda::Function
    Condition: HasCustomSender
    Metadata:
      com.aws.cloudformation.Context:
        why: "même archive que l'API (point d'entrée cognito-email.handler) ; déchiffre le code et l'envoie par Scaleway depuis l'expéditeur CognitoEmailFrom"
        mutable: free-to-tune
      # CodeBucket est vide par défaut ; la fonction n'existe qu'avec CodeKey, et la règle SenderNeedsCode exige alors CodeBucket
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cognito-email"
      Description: Envoi des codes de connexion et d'inscription de l'Espace Pro par Scaleway (déclencheur Cognito)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: cognito-email.handler
      Role: !GetAtt CognitoEmailRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 256
      Timeout: 15
      LoggingConfig: { LogGroup: !Ref CognitoEmailLogGroup, LogFormat: Text }
      Environment:
        Variables:
          NODE_ENV: production
          KEY_ARN: !GetAtt CognitoEmailKey.Arn
          SSM_PREFIX: !Ref SsmPrefix
          SCW_PROJECT_ID: !Ref ScwProjectId
          SCW_REGION: fr-par
          EMAIL_FROM: !Ref CognitoEmailFrom
          CONTACT: contact@pixcar.fr
          LOG_LEVEL: info
      Tags: [{ Key: Project, Value: pixcar }]

  CognitoEmailPermission:
    Type: AWS::Lambda::Permission
    Condition: HasCustomSender
    Properties:
      FunctionName: !Ref CognitoEmailFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

  # Cognito appelle la fonction de façon asynchrone : Lambda retente un envoi échoué, mais un code de plus de 5 minutes ne sert plus
  CognitoEmailInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: HasCustomSender
    Properties:
      FunctionName: !Ref CognitoEmailFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 300

  CognitoEmailErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasSenderAlarm
    Metadata:
      com.aws.cloudformation.Context:
        why: "appel asynchrone : une panne ne s'affiche pas sur la page (le code n'arrive pas) ; cette alarme est le seul signal"
        must: ["dès la première erreur"]
    Properties:
      AlarmDescription: "Espace Pro : l'envoi d'un code de connexion ou d'inscription par Scaleway a échoué (journal de la fonction cognito-email) ; si cela dure : retour arrière, docs/exploitation.md 10.10"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref CognitoEmailFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

Outputs:
  DkimRecord1:
    Description: CNAME DKIM n° 1 à publier chez le registraire (nom → valeur).
    Value: !Sub "${EmailIdentity.DkimDNSTokenName1} CNAME ${EmailIdentity.DkimDNSTokenValue1}"
  DkimRecord2:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName2} CNAME ${EmailIdentity.DkimDNSTokenValue2}"
  DkimRecord3:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName3} CNAME ${EmailIdentity.DkimDNSTokenValue3}"
  UserPoolId:
    Condition: HasAccounts
    Description: À passer à la pile pixcar (ProUserPoolId) et au build du site (PIXCAR_PRO_POOL, src/pro.json).
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: HasAccounts
    Description: À passer à la pile pixcar (ProClientId) et au build du site (PIXCAR_PRO_CLIENT, src/pro.json).
    Value: !Ref UserPoolClient
