<section id="consent" class="consent" aria-labelledby="consentTitle" hidden>
  <h2 id="consentTitle">Mesure d'audience</h2>
  <p>
    Pixcar peut compter ses visites avec Google Analytics&nbsp;: des cookies sont déposés et des données (adresse IP, pages vues)
    sont transmises à Google, seulement si vous acceptez. Le site fonctionne de la même façon dans les deux cas.
  </p>
  <div class="consent-actions">
    <button type="button" class="btn" data-consent="deny">Refuser</button>
    <button type="button" class="btn" data-consent="grant">Accepter</button>
  </div>
  <p class="consent-more"><button type="button" class="link-btn" data-open-legal data-consent-more>En savoir plus</button></p>
</section>
