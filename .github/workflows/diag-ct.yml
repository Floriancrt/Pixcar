# Diagnostic en lecture seule des prix du contrôle technique (jeu prix-controle-technique de data.economie.gouv.fr).
# Ne publie rien : écrit des statistiques et les lignes des centres de Bayonne dans le journal et le résumé de l'exécution.
name: Diagnostic prix contrôle technique
on:
  push:
    branches: [diag-ct-prix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le jeu complet
        run: |
          curl -sSf --retry 3 -o ct.json "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-controle-technique/exports/json?select=cct_siret,cct_denomination,cct_adresse,cct_code_postal,cct_commune,cat_vehicule_id,cat_vehicule_libelle,cat_energie_id,cat_energie_libelle,prix_visite,prix_contre_visite_mini,prix_contre_visite_maxi,date_application_visite,date_application_contre_visite"
          ls -l ct.json
      - name: Analyser
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, collections, re
          rows = json.load(open("ct.json"))
          def num(v):
              try: return float(v)
              except (TypeError, ValueError): return None
          vp = [r for r in rows if r.get("cat_vehicule_id") in (1, "1")]
          vals = [num(r.get("prix_visite")) for r in vp]
          vals = [v for v in vals if v is not None]
          print(f"## Voiture particulière : {len(vp)} lignes\n")
          print("### Valeurs basses (< 50 €) : valeur -> lignes\n")
          for v, n in sorted(collections.Counter(v for v in vals if v < 50).items()): print(f"- {v} : {n}")
          print("\n### Valeurs hautes (> 140 €) : valeur -> lignes\n")
          for v, n in sorted(collections.Counter(v for v in vals if v > 140).items()): print(f"- {v} : {n}")
          print("\n### Contre-visite : valeurs > 100 € (CV maxi)\n")
          cv = collections.Counter(num(r.get("prix_contre_visite_maxi")) for r in vp if (num(r.get("prix_contre_visite_maxi")) or 0) > 100)
          for v, n in sorted(cv.items()): print(f"- {v} : {n}")
          # ancien choix du site (toutes catégories hors 2 et 3 roues, le moins cher) contre le nouveau (voiture particulière, prix valide)
          L = re.compile(r"cyclo|moto|tricycle|quadri|cat[ée]gorie\s*l\b|\bl[1-7]e?\b|2\s*roues|3\s*roues|deux.roues", re.I)
          by = collections.defaultdict(list)
          for r in rows: by[r.get("cct_siret")].append(r)
          def pick(rs, energy, new):
              if new:
                  c = [r for r in rs if r.get("cat_vehicule_id") in (1, "1") and (num(r.get("prix_visite")) or 0) >= 20 and num(r.get("prix_visite")) < 300]
              else:
                  c = [r for r in rs if not L.search(r.get("cat_vehicule_libelle") or "") and num(r.get("prix_visite")) is not None]
              m = [r for r in c if energy.lower() in (r.get("cat_energie_libelle") or "").lower()]
              c = m or c
              return min((num(r.get("prix_visite")) for r in c), default=None)
          for energy in ("Essence", "Diesel", "Electrique"):
              diff = zero = none_new = 0
              for s, rs in by.items():
                  o, n = pick(rs, energy, False), pick(rs, energy, True)
                  if o != n: diff += 1
                  if o == 0: zero += 1
                  if n is None: none_new += 1
              print(f"\n### {energy} : centres dont le prix affiché change : {diff} sur {len(by)} ; affichés à 0 € avant : {zero} ; sans prix valide après : {none_new}")
          PY
