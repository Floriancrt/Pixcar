# Construction de la table de garages (tuiles statiques tirées d'Overture Maps) : voir scripts/garages/README.md et docs/exploitation.md, section 8.
# Ce workflow NE PUBLIE RIEN : il construit les tuiles, les contrôle, les range dans un artefact (14 jours) et écrit un résumé en agrégats.
# Pour les joindre au site : télécharger l'artefact (ou, avec data_branch, récupérer la branche garages-data…), puis `node scripts/build.mjs --pages pixcar.fr --garages <dossier>` (après accord de l'éditeur).
name: Table de garages

on:
  workflow_dispatch:
    inputs:
      area:
        description: "france | bbox:ouest,sud,est,nord | dept:<nom Overture>"
        default: "dept:Haute-Garonne"
      rough:
        description: "avec dept: : boîte large autour du département (ouest,sud,est,nord)"
        default: "0.2,42.5,2.3,44.1"
      dept_codes:
        description: "codes des départements pour le registre (31 ; ignoré avec france)"
        default: "31"
      sirene:
        description: "écarter les lieux fermés d'après le registre SIRENE"
        type: choice
        options: ["on", "off"]
        default: "on"
      data_branch:
        description: "déposer aussi les tuiles sur cette branche (garages-data… ; vide : artefact seulement). Une branche à un seul commit, remplacée à chaque fois ; rien n'est publié"
        default: ""
  # Mensuel, à activer le jour où la table est publiée (Overture publie une version par mois) :
  # schedule:
  #   - cron: "17 4 4 * *"
  push:
    branches: [garages-table]
    paths:
      - "scripts/garages/**"
      - ".github/workflows/garages.yml"

permissions:
  contents: write # seulement pour l'étape « Déposer les tuiles » (branche garages-data…) ; le reste du travail ne fait que lire

concurrency:
  group: garages-${{ inputs.area || 'push' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash # « bash -eo pipefail » : un échec dans un tube arrête l'étape
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances
        run: pip install --quiet -r scripts/garages/requirements.txt
      - name: Tests (sans réseau)
        run: python scripts/garages/test_garages.py
      - name: Construction
        env:
          AREA: ${{ inputs.area || 'dept:Haute-Garonne' }}
          ROUGH: ${{ inputs.rough || '0.2,42.5,2.3,44.1' }}
          CODES: ${{ inputs.dept_codes || '31' }}
          SIRENE: ${{ inputs.sirene || 'on' }}
        run: |
          python scripts/garages/build.py --area "$AREA" --rough "$ROUGH" --dept-codes "$CODES" --sirene "$SIRENE" \
            --out build/garages --probe 43.217426,1.10145,10 --print-dropped --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: garages
          path: build/garages
          retention-days: 14
      - name: Déposer les tuiles sur une branche de données (facultatif, ne publie rien)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.data_branch != '' }}
        env:
          BRANCH: ${{ inputs.data_branch }}
          AREA: ${{ inputs.area }}
          TOKEN: ${{ github.token }}
        run: |
          # Le nom est contrôlé : jamais main, jamais gh-pages, jamais une branche de travail (le dépôt est forcé, un seul commit).
          if ! [[ "$BRANCH" =~ ^garages-data[a-z0-9-]*$ ]]; then echo "::error::data_branch doit commencer par garages-data (reçu : $BRANCH)"; exit 1; fi
          cd build/garages
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tuiles de la table de garages ($AREA, $(date -u +%F)), construites depuis ${GITHUB_SHA::7}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push -f "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          echo "Tuiles déposées sur la branche $BRANCH ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
