# Déploiement de l'API sur AWS (pile CloudFormation « pixcar ») : voir docs/exploitation.md, « Déploiement automatique de l'API ».
# 1. « Tests et paquet » (sans aucun droit AWS) : tests unitaires et serveur, paquet construit deux fois à l'identique, comparé à celui
#    du commit précédent : s'il n'a pas changé (un push qui ne touche que la page), rien n'est demandé.
# 2. « Déploiement » : attend l'approbation de l'environnement GitHub « production », puis prend le rôle AWS par OIDC (aucune clé
#    stockée) et lance scripts/deploy-api.mjs : fonction d'opérations d'abord (migration, auto-contrôle), API ensuite (essai de bout en
#    bout), retour arrière automatique de l'étape en échec. Le compte rendu s'affiche dans le résumé de l'exécution.
# Le site (gh-pages) n'est pas publié ici.
name: Déployer l'API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "db/**"
      - "src/js/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-lambda.mjs"
      - "scripts/deploy-api.mjs"
      - "scripts/smoke-api.mjs"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: # à la main (Actions > Déployer l'API > Run workflow) : déploie le paquet de main même s'il n'a pas changé depuis le commit précédent

permissions:
  contents: read

jobs:
  build:
    name: Tests et paquet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # les suites du navigateur ne tournent pas ici
    outputs:
      file: ${{ steps.pkg.outputs.file }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Tests unitaires et serveur (base PGlite)
        run: npm run -s test:unit && npm run -s test:server
      - name: Paquet (construit deux fois, à l'identique)
        id: pkg
        run: node scripts/deploy-api.mjs package --out dist-lambda
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: dist-lambda/${{ steps.pkg.outputs.file }}
          retention-days: 30
          if-no-files-found: error
      - name: Le paquet a-t-il changé depuis le commit précédent ?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          changed=true
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # en cas d'échec de cette comparaison, on déploie (l'approbation reste demandée)
            if git fetch --no-tags --depth=1 origin "$BEFORE" && git checkout -q "$BEFORE" && npm ci --silent; then
              prev=$(node scripts/build-lambda.mjs --out "$RUNNER_TEMP/before" | sed -n 's/^\(pixcar-lambda-[0-9a-f]*\.zip\).*/\1/p' || true)
              echo "paquet du commit précédent : ${prev:-?} ; de celui-ci : $FILE"
              [ "$prev" = "$FILE" ] && changed=false
            fi
            git checkout -q "$GITHUB_SHA"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            echo "Paquet de l'API inchangé ($FILE) : pas de déploiement demandé. Pour forcer : Actions > Déployer l'API > Run workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Déploiement (après approbation)
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production # règles de l'environnement : ton approbation, branche main seulement ; variable AWS_DEPLOY_ROLE_ARN
      url: https://api.pixcar.fr/readyz
    concurrency:
      group: deploy-api # un déploiement à la fois ; un nouveau push remplace celui qui attend encore l'approbation
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # jeton OIDC pour prendre le rôle d'infra/pixcar-deploy.yaml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist-lambda
      - name: Rôle de déploiement configuré ?
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Variable AWS_DEPLOY_ROLE_ARN absente de l'environnement production (sortie DeployRoleArn de la pile infra/pixcar-deploy.yaml ; docs/exploitation.md)"
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: pixcar-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Déployer (opérations, migration, auto-contrôle, puis API et essai de bout en bout)
        env:
          FILE: ${{ needs.build.outputs.file }}
        run: node scripts/deploy-api.mjs deploy --zip "dist-lambda/$FILE" --stack pixcar --region eu-north-1 --summary "$GITHUB_STEP_SUMMARY"
